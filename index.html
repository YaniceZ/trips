<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行计划</title>
<meta name="theme-color" content="#F4F0E6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F0E6; --card:#FCFAF4; --ink:#2A2620; --slate:#4D473C; --mist:#756E60; --faint:#A0988A;
  --line:#D8D0BD; --acc:#A8432E;
  --disp:'Noto Serif SC','Source Han Serif SC','Songti SC','Noto Serif CJK SC',serif;
  --body:'Noto Sans SC','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;
  -webkit-font-smoothing:antialiased;min-height:100dvh;
  padding:clamp(28px,7vw,76px) clamp(20px,6vw,44px) 64px;padding-top:calc(clamp(28px,7vw,76px) + env(safe-area-inset-top))}
.wrap{max-width:720px;margin:0 auto}

h1{font-family:var(--disp);font-weight:700;font-size:clamp(34px,8vw,48px);line-height:1.2;margin:0}
.sub{color:var(--mist);margin:8px 0 0;font-size:15px}
.next{margin:30px 0 0;padding:14px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.next .l{color:var(--mist);font-size:14px}
.next .l b{color:var(--ink);font-weight:500}
.next .n{font-family:var(--disp);font-weight:700;font-size:26px;white-space:nowrap;font-variant-numeric:tabular-nums}
.next .n small{font-family:var(--body);font-weight:400;font-size:14px;color:var(--mist);margin-left:4px}

.yr{font-family:var(--disp);font-weight:700;font-size:18px;margin:44px 0 0;padding-bottom:8px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline}
.yr span{font-family:var(--body);font-weight:400;font-size:13.5px;color:var(--mist)}

a.row{display:grid;grid-template-columns:34px 1fr;gap:0 6px;padding:20px 0 19px;border-bottom:1px solid var(--line);
  color:inherit;text-decoration:none}
a.row .i{color:var(--faint);font-size:14px;padding-top:5px;font-variant-numeric:tabular-nums}
a.row .t{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
a.row h2{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.4;margin:0;
  text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:6px;transition:text-decoration-color .2s}
a.row:hover h2,a.row:focus-visible h2{text-decoration-color:var(--c)}
a.row:focus-visible{outline:2px solid var(--c);outline-offset:4px}
a.row .d{color:var(--mist);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
a.row .z{grid-column:2;color:var(--slate);font-size:14.5px;margin:3px 0 0}
a.row .p{grid-column:2;color:var(--mist);font-size:14px;margin:7px 0 0;line-height:1.75}
a.row .m{grid-column:2;color:var(--mist);font-size:13.5px;margin:7px 0 0}
a.row .m i{font-style:normal;color:var(--c);font-weight:500}

footer{margin-top:40px;color:var(--mist);font-size:13.5px;line-height:1.9}
@media (max-width:520px){a.row{grid-template-columns:26px 1fr} a.row h2{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>旅行计划</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="next" id="next" hidden></div>

  <main id="list"></main>

  <footer>
    每个目的地各有一页，里面有地图、逐日行程、住宿、预算，还能记航班、租车和分账。<br>
    在手机上选「添加到主屏幕」，没网的地方也能打开。
  </footer>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   想改首页，只改这个数组。
   start / end：用来排序、分年份、算倒计时
   when：卡片上显示的日期文字
   c：这一行的点缀色
   ══════════════════════════════════════════════════════════ */
const TRIPS=[
 {href:'./banff-2027/', c:'#2F6F73', start:'2027-08-27', end:'2027-09-01',
  name:'Banff · Calgary', zh:'落基山，温哥华自驾往返 / 飞抵 / 冬季滑雪',
  when:'8.27 → 9.01', len:'6 天 5 晚', plans:'5 套方案', key:'日期可自定义',
  desc:'Calgary 连住四晚 6 天、Banff 5 天、飞抵 4 天、含 Jasper 8 天、冬季滑雪 7 天。每套方案的日期都能改。'},

 {href:'./fall-2027/', c:'#A8432E', start:'2027-09-24', end:'2027-10-06',
  name:'加拿大赏枫', zh:'Algonquin / Charlevoix / Cape Breton / Yukon',
  when:'9.24 → 10.06', len:'6–8 天', plans:'4 条线路', key:'变色窗口图',
  desc:'枫叶自北向南变红，四条线的高峰期差 1–2 周。页面会按你选的日期算和各线高峰重叠几天。'},

 {href:'./kansai-2027/', c:'#B3432F', start:'2027-09-17', end:'2027-10-06',
  name:'関西・四国・熊野古道', zh:'大阪 · 四国自驾 · 京都旅居 · 熊野徒步',
  when:'9.17 → 10.06', len:'18 晚', plans:'4 个方案', key:'熊野中边路 3 天',
  desc:'先在大阪倒时差，再环四国自驾，京都住 6 晚，最后走熊野中边路。顺序是按台风季风险排的。'},

 {href:'./japow-2027/', c:'#2F5D8A', start:'2027-01-08', end:'2027-01-24',
  name:'JAPOW 留寿都 / 白马', zh:'Epic Pass · 5+5 天',
  when:'1.08 → 1.24', len:'17 天', plans:'10 个滑雪日', key:'实时雪情',
  desc:'Epic 在日本只含两家雪场，各 5 天且必须连续用。页面带未来 7 天降雪预报和去年同期实测。'},

 {href:'./camino-2027/', c:'#946414', start:'2027-05-08', end:'2027-05-23',
  name:'Camino de Santiago', zh:'朝圣之路，最后 100 公里，西班牙北部',
  when:'5.08 → 5.23', len:'16 天', plans:'4 条路线', key:'115 km 步行',
  desc:'Sarria 走到 Santiago，115 公里，走满即可领 Compostela 证书。剩下的天数留给圣塞瓦斯蒂安、毕尔巴鄂和马德里。'},

 {href:'./andes-2027/', c:'#A23B30', start:'2027-06-12', end:'2029-01-24',
  name:'Los Andes', zh:'南美四程：秘鲁 / 玻利维亚 / 巴塔哥尼亚 / 哥伦比亚',
  when:'2027.06 → 2029.01', len:'54 天，分四趟', plans:'最高 4278 m', key:'海拔曲线',
  desc:'四地最佳季节互不重叠，所以拆成四趟分年去。页面按每晚睡眠海拔算高反风险，超标的日子标红。'}
];

const $=s=>document.querySelector(s);
const D=s=>new Date(s+'T00:00:00');
const today=new Date(); today.setHours(0,0,0,0);
const sorted=[...TRIPS].sort((a,b)=>D(a.start)-D(b.start));

$('#sub').textContent=`${sorted[0].start.slice(0,4)} — ${sorted[sorted.length-1].end.slice(0,4)}，${TRIPS.length} 个目的地`;

/* 下一次出发 */
const up=sorted.find(t=>D(t.end)>=today);
const nx=$('#next');
if(up){
  const going=D(up.start)<=today, days=Math.round((D(up.start)-today)/864e5);
  nx.innerHTML=going
    ?`<span class="l">正在进行　<b>${up.name}</b></span><span class="n">${Math.round((today-D(up.start))/864e5)+1}<small>天</small></span>`
    :`<span class="l">下一次出发　<b>${up.name}</b></span><span class="n">${days}<small>天后</small></span>`;
  nx.hidden=false;
}

/* 按年份分组 */
const list=$('#list'); let idx=0, yr=null;
sorted.forEach(t=>{
  const y=t.start.slice(0,4);
  if(y!==yr){
    yr=y;
    const n=sorted.filter(x=>x.start.slice(0,4)===y).length;
    const h=document.createElement('div'); h.className='yr'; h.innerHTML=`${y}<span>${n} 个</span>`;
    list.appendChild(h);
  }
  idx++;
  const a=document.createElement('a'); a.className='row'; a.href=t.href; a.style.setProperty('--c',t.c);
  a.innerHTML=`<span class="i">${String(idx).padStart(2,'0')}</span>
    <div class="t"><h2>${t.name}</h2><span class="d">${t.when}</span></div>
    <p class="z">${t.zh}</p>
    <p class="p">${t.desc}</p>
    <p class="m">${t.len}　·　${t.plans}　·　<i>${t.key}</i></p>`;
  list.appendChild(a);
});
</script>
</body>
</html>

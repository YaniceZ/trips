<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Automne — 加拿大赏枫</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E1513">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 底色：冷灰白，不是暖米色 */
  --paper:#0E1513; --card:#161F1C; --card-2:#1D2724; --sunk:#25302C;
  --ink:#F2EDE2; --slate:#B5AE9E; --mist:#8A8677; --faint:#5F5F55;
  --line:#2C3733; --line-2:#212B28;
  /* 日本雪道分级色，当成设计系统用 */
  --gr:#6FA07A;  /* 常绿针叶 */
  --rd:#C8412B;  /* 糖枫红 */
  --bk:#F2EDE2;
  --blu:#5E8C93; /* 秋日湖水 */
  --amb:#E0A526; /* 白桦金 */
  --disp:'Fraunces','Noto Serif SC',serif;
  --body:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sheet-h:55vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-weight:400;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px;border-radius:3px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--card)}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}

#app{display:flex;flex-direction:column;height:100%;height:100dvh;overflow:clip}

/* ── header ── */
header{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);
  padding:11px 18px 0;padding-top:calc(11px + env(safe-area-inset-top));position:relative;z-index:1200}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{flex:1 1 auto;min-width:190px}
.brand h1{font-family:var(--disp);font-weight:900;font-size:23px;margin:0;letter-spacing:-.015em;line-height:1.05;font-variation-settings:'SOFT' 40,'WONK' 1}
.brand h1 i{font-style:normal;color:var(--rd)}
.brand .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--mist);
  margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.brand .sub b{color:var(--slate);font-weight:600}
.hright{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);border:1px solid var(--line);
  border-radius:7px;padding:5px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--slate);transition:.16s}
.chip:hover{border-color:var(--faint);background:var(--sunk)}
.chip b{color:var(--ink);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gr);flex:none}
.dot.off{background:var(--faint)} .dot.busy{background:var(--amb);animation:pl .9s infinite}
@keyframes pl{50%{opacity:.2}}
.avatars{display:flex}
.av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);
  font-size:10px;font-weight:600;color:#fff;border:2px solid var(--card);margin-left:-6px;flex:none}
.av:first-child{margin-left:0}

/* ── 方案切换：雪道牌 ── */
.opts{display:flex;gap:7px;padding:12px 0 11px;overflow-x:auto;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opt{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;
  border:1px solid var(--line);border-radius:9px;background:var(--card-2);transition:.18s;text-align:left}
.opt:hover{border-color:var(--faint);background:var(--sunk)}
.opt[aria-pressed=true]{border-color:var(--oc);background:var(--card);box-shadow:0 0 0 1px var(--oc),0 2px 8px rgba(15,21,28,.07)}
.opt .gr{width:30px;height:30px;flex:none;border-radius:50% 50% 50% 4px;background:transparent;
  border:1.5px solid var(--oc);display:grid;place-items:center;color:var(--oc);
  font-family:var(--disp);font-weight:900;font-size:14px;transform:rotate(-8deg);
  transition:background .2s,color .2s}
.opt .gr>span{display:block;transform:rotate(8deg)}
.opt[aria-pressed=true] .gr{background:var(--oc);color:#0E1513}
.opt .lab{display:block;font-size:13px;font-weight:500;white-space:nowrap;line-height:1.3}
.opt .met{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--mist);
  white-space:nowrap;margin-top:1px}

/* ── main ── */
main{flex:1 1 auto;display:flex;min-height:0;position:relative;overflow:clip}
#map{flex:1 1 auto;min-width:0;background:#0A100E;z-index:1}
#panel{flex:0 0 432px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:2}
.tabs{flex:0 0 auto;display:flex;border-bottom:1px solid var(--line);background:var(--card);
  padding:0 8px;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 auto;padding:12px 6px 10px;font-size:12.5px;color:var(--mist);
  border-bottom:2px solid transparent;transition:.16s;white-space:nowrap}
.tab:hover{color:var(--slate)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--rd);font-weight:500}
.tab .n{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-left:3px}
.scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:18px 18px 64px}

/* ── typography ── */
h2.sec{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  margin:0 0 11px;font-weight:600;display:flex;align-items:center;gap:9px}
h2.sec:after{content:'';flex:1;height:1px;background:var(--line-2)}
h2.sec+h2.sec{margin-top:26px}
.t-big{font-family:var(--disp);font-size:21px;font-weight:900;line-height:1.35;margin:0 0 9px;letter-spacing:-.005em}
p.tx{font-size:14px;color:var(--slate);line-height:1.85;margin:0 0 15px}
p.tx b{color:var(--ink);font-weight:600}
.callout{background:var(--card-2);border:1px solid var(--line-2);border-left:3px solid var(--amb);
  border-radius:0 8px 8px 0;padding:11px 13px;margin:0 0 18px}
.callout .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--amb);
  text-transform:uppercase;font-weight:600}
.callout p{margin:4px 0 0;font-size:13.5px;color:var(--slate);line-height:1.75}

/* ── 签名 1：Epic 配额条 ── */
.quota{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:18px;background:var(--card-2)}
.qrow{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.qrow:last-child{margin-bottom:0}
.qname{flex:0 0 62px;font-size:12.5px;font-weight:500}
.qslots{display:flex;gap:4px;flex:1}
.qs{flex:1;height:23px;border-radius:4px;background:var(--sunk);border:1px solid var(--line-2);
  display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.qs.on{background:var(--qc);border-color:var(--qc);color:#fff;font-weight:600}
.qtot{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--slate)}
.qnote{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--mist);
  margin-top:11px;padding-top:10px;border-top:1px solid var(--line-2);line-height:1.7}
.qnote.warn{color:var(--rd)}

/* ── 签名 2：时机热力表 ── */
.tm{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px;background:var(--card)}
.tmg{display:grid;grid-template-columns:52px repeat(7,1fr)}
.tmc{padding:5px 2px;text-align:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.02em;
  color:var(--mist);border-bottom:1px solid var(--line-2);background:var(--card-2)}
.tmc.pk{color:var(--rd);font-weight:600}
.tmh{padding:0 8px;font-size:11.5px;height:26px;white-space:nowrap;color:var(--slate);border-bottom:1px solid var(--line-2);
  border-right:1px solid var(--line-2);background:var(--card-2);display:flex;align-items:center}
.tmv{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);height:26px;
  display:grid;place-items:center;font-family:var(--mono);font-size:8.5px;color:#fff;font-weight:600}
.tmg>*:nth-last-child(-n+8){border-bottom:0}
.tmleg{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;
  color:var(--mist);margin:0 0 18px;letter-spacing:.04em}
.tmleg i{font-style:normal;display:inline-flex;align-items:center;gap:3px}
.tmleg b{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ── 行程 ── */
.spine{position:relative;padding-left:32px}
.spine:before{content:'';position:absolute;left:11px;top:16px;bottom:22px;width:2px;background:var(--line-2)}
.day{position:relative;margin-bottom:5px}
.daybtn{width:100%;text-align:left;padding:11px 12px;border-radius:9px;border:1px solid transparent;transition:.16s}
.daybtn:hover{background:var(--card-2)}
.day.open .daybtn{background:var(--card-2);border-color:var(--line)}
.node{position:absolute;left:-34px;top:14px;width:36px;height:24px;border-radius:3px;
  background:var(--card);border:1px solid var(--nc);display:grid;place-items:center;z-index:2;
  font-family:var(--mono);font-size:9px;font-weight:600;color:var(--nc);line-height:1}
.node small{display:block;font-size:6.5px;letter-spacing:.05em;opacity:.6;margin-top:1px}
.node.jump{border-width:2px;border-color:var(--rd);color:var(--rd)}
.day.open .node{background:var(--nc);color:#14110F}
.day.open .node.jump{background:var(--rd);color:#14110F;border-color:var(--rd)}
/* 安第斯织纹脊柱 */
.spine{padding-left:42px}
.spine:before{left:16px;width:6px;border-radius:0;background:
 repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px),
 repeating-linear-gradient(-45deg,var(--line) 0 3px,transparent 3px 6px)}
.ddate{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mist)}
.dtitle{font-family:var(--disp);font-size:15.5px;font-weight:700;margin-top:2px;line-height:1.4}
.dnote{font-size:13px;color:var(--slate);margin-top:5px;line-height:1.7}
.dmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:3px 7px;border-radius:4px;
  background:var(--sunk);color:var(--slate)}
.pill.sk{background:var(--nc);color:#fff;font-weight:600}
.pill.st{background:transparent;border:1px solid var(--line);color:var(--mist)}
.dbody{display:none;padding:0 12px 14px}
.day.open .dbody{display:block}
.stop{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line-2);width:100%;text-align:left;transition:.14s}
.stop:hover{opacity:.65}
.stop .t{font-family:var(--mono);font-size:10px;color:var(--faint);flex:0 0 44px;padding-top:3px}
.stop .n{font-size:13px;line-height:1.55}
.stop .n small{display:block;color:var(--mist);font-size:11.5px;margin-top:2px;line-height:1.6}

/* ── 卡片 ── */
.pc{border:1px solid var(--line-2);border-radius:9px;padding:11px 12px;margin-bottom:7px;
  background:var(--card);transition:.16s;position:relative}
.pc:hover{border-color:var(--line);box-shadow:0 2px 10px rgba(15,21,28,.05)}
.pc .top{display:flex;align-items:flex-start;gap:9px}
.pc .sw{width:8px;height:8px;border-radius:2px;flex:none;margin-top:7px;background:var(--pc)}
.pc h3{margin:0;font-size:13.5px;font-weight:500;line-height:1.5;flex:1}
.pc h3 span{font-family:var(--mono);color:var(--faint);font-size:10.5px;margin-left:6px;letter-spacing:.04em}
.pc p{margin:5px 0 0;font-size:12.5px;color:var(--slate);line-height:1.7}
.pc .foot{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.byl{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;color:var(--mist)}
.mini{width:14px;height:14px;border-radius:4px;display:grid;place-items:center;font-size:7.5px;
  font-weight:600;color:#fff;font-family:var(--mono)}
.act{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:4px 8px;border-radius:5px;
  border:1px solid var(--line);color:var(--mist);transition:.15s}
.act:hover{border-color:var(--faint);color:var(--slate)}
.act.on{border-color:var(--rd);color:var(--rd);background:rgba(200,65,43,.14)}

/* ── forms ── */
.fd{margin-bottom:12px}
label.lb{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;color:var(--mist);
  text-transform:uppercase;margin-bottom:5px;font-weight:600}
input[type=text],input[type=number],textarea{width:100%;background:var(--card-2);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font-size:13.5px;transition:.16s}
input:focus,textarea:focus{outline:none;border-color:var(--blu);background:var(--card)}
textarea{resize:vertical;min-height:62px;line-height:1.65}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:7px;
  border:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  color:var(--slate);transition:.16s;background:var(--card)}
.btn:hover{border-color:var(--faint);background:var(--card-2)}
.btn.pri{background:var(--rd);border-color:var(--rd);color:#F2EDE2;font-weight:600}
.btn.pri:hover{background:#C0332B;border-color:#C0332B}
.row{display:flex;gap:7px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}

/* ── budget ── */
.btot{border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:14px;background:var(--card-2);
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btot .big{font-family:var(--mono);font-size:29px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.btot .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--mist);
  text-transform:uppercase;margin-bottom:6px;font-weight:600}
.btot .side{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--mist)}
.bl{padding:10px 0;border-bottom:1px solid var(--line-2)}
.bl .lr{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bl .nm{font-size:13.5px}
.bl .nm small{display:block;color:var(--mist);font-size:11px;margin-top:1px;line-height:1.6}
.bl .vv{font-family:var(--mono);font-size:13.5px;color:var(--ink);white-space:nowrap;font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:var(--line);
  border-radius:3px;margin:11px 0 1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:5px;
  background:var(--blu);cursor:grab;border:3px solid var(--card)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:5px;background:var(--blu);
  cursor:grab;border:3px solid var(--card)}

/* ── checklist ── */
.td{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2);align-items:flex-start;
  width:100%;text-align:left}
.box{width:17px;height:17px;border:1.5px solid var(--line);border-radius:5px;flex:none;margin-top:3px;
  display:grid;place-items:center;transition:.16s;background:var(--card)}
.td.done .box{background:var(--gr);border-color:var(--gr)}
.td.done .box:after{content:'';width:4px;height:8px;border:solid #0E1513;border-width:0 2px 2px 0;
  transform:rotate(43deg) translate(-1px,-1px)}
.td.done .tx2{color:var(--faint);text-decoration:line-through}
.tx2{font-size:13.5px;line-height:1.6;flex:1}
.tx2 small{display:block;color:var(--mist);font-size:11.5px;margin-top:2px;line-height:1.65}
.due{font-family:var(--mono);font-size:9.5px;color:var(--rd);flex:none;margin-top:4px;letter-spacing:.04em}
.due.ok{color:var(--faint)}

/* ── map overlay ── */
.mc{position:absolute;top:12px;right:12px;z-index:900;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mb{background:rgba(22,31,28,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:7px;
  padding:7px 11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;color:var(--slate);
  transition:.15s;white-space:nowrap;box-shadow:0 1px 5px rgba(15,21,28,.07)}
.mb:hover{color:var(--ink);border-color:var(--faint)}
.mb.on{color:var(--rd);border-color:var(--rd)}
.leaflet-container{background:#0A100E;font-family:var(--body)}
.leaflet-control-attribution{background:rgba(14,21,19,.85)!important;font-size:9px!important;font-family:var(--mono)!important;color:var(--mist)!important}
.leaflet-popup-content-wrapper{background:var(--card);border-radius:9px;border:1px solid var(--line);
  box-shadow:0 10px 32px rgba(15,21,28,.16)}
.leaflet-popup-tip{background:var(--card);border:1px solid var(--line)}
.leaflet-popup-content{margin:11px 13px;font-size:12.5px;line-height:1.7;color:var(--slate)}
.leaflet-popup-content b{font-family:var(--disp);font-size:14px;font-weight:700;color:var(--ink);
  display:block;margin-bottom:2px}
.leaflet-popup-content .jp{font-family:var(--mono);color:var(--faint);font-size:10.5px}
.leaflet-popup-content .mt{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--faint);
  margin-top:6px;display:block}
.pinico{display:grid;place-items:center;border-radius:50% 50% 50% 3px;border:2px solid #0E1513;color:#0E1513;
  box-shadow:0 2px 7px rgba(15,21,28,.28);font-family:var(--mono);font-weight:600;font-size:9.5px}
.pinico.usr{border-radius:6px 6px 6px 2px}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);z-index:3000;background:var(--sunk);border:1px solid var(--line);
  border-radius:8px;padding:10px 16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink);
  transition:transform .3s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;
  box-shadow:0 10px 32px rgba(15,21,28,.28);max-width:88vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:2500;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(6,10,9,.7);backdrop-filter:blur(5px)}
#modal.show{display:flex}
.mbox{background:var(--card);border-radius:13px;padding:21px;width:100%;max-width:396px;max-height:86vh;
  overflow-y:auto;box-shadow:0 22px 64px rgba(15,21,28,.28)}
.mbox h3{font-family:var(--disp);font-size:17px;font-weight:900;margin:0 0 4px}
.mbox .mp{font-size:13px;color:var(--slate);margin:0 0 15px;line-height:1.75}

/* ── mobile ── */

/* 深链行 */
.sigrow{display:flex;align-items:flex-start;gap:7px;margin-top:8px;font-size:12px;
 line-height:1.7;color:var(--slate);background:var(--sunk);border-left:2px solid var(--blu);
 border-radius:0 6px 6px 0;padding:7px 10px}
.sigi{width:10px;height:10px;flex:none;margin-top:5px;border-radius:50%;background:var(--blu);opacity:.55}
.lkrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.lk2{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;

/* ═══════ 1. 存储适配层 ═══════ */
const mem=new Map();
const S={ok:typeof window.storage!=='undefined'&&window.storage,
 async get(k,sh=false){if(!this.ok)return mem.has(k+sh)?mem.get(k+sh):null;
  try{const r=await window.storage.get(k,sh);return r?JSON.parse(r.value):null}catch(e){return null}},
 async set(k,v,sh=false){if(!this.ok){mem.set(k+sh,v);return true}
  try{await window.storage.set(k,JSON.stringify(v),sh);return true}catch(e){return false}}};



/* 只硬编码我能确认的链接；其余走日文搜索 —— 官网改版了也不会失效 */
const SITE={};
async function copyJP(p){
 try{await navigator.clipboard.writeText(p.jp)}
 catch(e){const t=document.createElement('textarea');t.value=p.jp;document.body.appendChild(t);
  t.select();try{document.execCommand('copy')}catch(_){}t.remove()}
 toast('已复制「'+p.jp+'」')}

/* ── 实地笔记：你们写的，压在我写的上面 ── */
function notesOf(id){return (st.notes||{})[id]||[]}
async function addNote(id,txt){st.notes=st.notes||{};
 st.notes[id]=notesOf(id).concat([{by:st.me.name,at:new Date().toISOString().slice(0,10),t:txt}]);
 await S.set(K.notes(),st.notes,true);renderBody()}
async function delNote(id,i){st.notes[id]=notesOf(id).filter((_,k)=>k!==i);
 if(!st.notes[id].length)delete st.notes[id];
 await S.set(K.notes(),st.notes,true);renderBody()}
function noteModal(p){
 if(!st.me.name)return meM(()=>noteModal(p));
 openM(`<h3>${esc(p.zh)}</h3><p class="mp">${esc(TXT.noteHint)}</p>
  <div class="fd"><textarea id="nt" maxlength="300" placeholder="例：1/12 首缆 8:15 排队，缆车 12 分钟到顶。山顶食堂只收现金。"></textarea></div>
  <div class="row"><button class="btn" data-close>取消</button><button class="btn pri" id="nok">记下</button></div>`,
 b=>{b.querySelector('#nt').focus();
  b.querySelector('#nok').onclick=async()=>{const t=b.querySelector('#nt').value.trim();
   if(!t)return toast('写点什么');closeM();await addNote(p.id,t);toast('记下了')}})}
function noteBlock(p){
 const ns=notesOf(p.id);if(!ns.length)return null;
 const w=el('div','notes');
 ns.forEach((n,i)=>{const r=el('div','note');
  r.innerHTML=`<div class="nb">${esc(n.t)}</div><div class="nm">${esc(n.by||'匿名')} · ${esc(n.at||'')}</div>`;
  if(n.by===st.me.name){const d=el('button','ndel','×');
   d.onclick=e=>{e.stopPropagation();delNote(p.id,i)};r.appendChild(d)}
  w.appendChild(r)});
 return w}

/* ── 实时雪情：Open-Meteo，无 key，CORS 开放，模型含 JMA ── */
const WXP=[{k:'algonquin',n:'Algonquin',lat:45.5350,lng:-78.6800},{k:'charlevoix',n:'Charlevoix',lat:47.4419,lng:-70.5044}];
let WX={fc:null,hist:null,at:0,err:null};
function lastYear(dstr){ /* "2027.01.08 → 01.24" → 去年同期 */
 const m=dstr.match(/(\d{4})\.(\d{2})\.(\d{2}).*?(\d{2})\.(\d{2})/);if(!m)return null;
 const y=+m[1]-1;return{a:`${y}-${m[2]}-${m[3]}`,b:`${y}-${m[4]}-${m[5]}`}}
function tripWindow(v){
  const a=dayInfo(v,0), b=dayInfo(v,v.days.length-1);
  if(!a.iso) return null;
  const ly=x=>String(+x.slice(0,4)-1)+x.slice(4);
  return {a:a.iso,b:b.iso,la:ly(a.iso),lb:ly(b.iso)};
}
async function loadWX(force){
 const cache=await S.get('fall:wx');
 if(!force&&cache&&Date.now()-cache.at<3*3600e3){WX=cache;return}
 const la=WXP.map(x=>x.lat).join(','),lo=WXP.map(x=>x.lng).join(',');
 try{
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}`+
   `&daily=precipitation_sum,temperature_2m_max,temperature_2m_min,weather_code`+
   `&timezone=America%2FToronto&forecast_days=7`);
  if(!r.ok)throw 0;
  const j=await r.json();WX.fc=Array.isArray(j)?j:[j];WX.err=null;
 }catch(e){WX.err='预报没拉到';if(cache)WX.fc=cache.fc}
 const ly=tripWindow(V[st.opt]);
 if(ly){try{
   const r2=await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${la}&longitude=${lo}`+
    `&start_date=${ly.la}&end_date=${ly.lb}&daily=precipitation_sum,temperature_2m_max&timezone=America%2FToronto`);
   if(r2.ok){const j2=await r2.json();WX.hist={win:ly,d:Array.isArray(j2)?j2:[j2]}}
  }catch(e){if(cache&&cache.hist)WX.hist=cache.hist}}
 WX.at=Date.now();await S.set('fall:wx',WX)}
function wxBlock(s){
 if(WX.hist){
  const box=el('div','wx');
  box.appendChild(el('div','wxh',`<span class="wxn">去年同期实测</span><span class="wxm">${WX.hist.win.la} → ${WX.hist.win.lb}</span>`));
  const rowd=el('div','wxd');
  WXP.forEach((pt,i)=>{
   const dd=WX.hist.d[i]?.daily||{};
   const arr=dd.precipitation_sum||[];
   const rain=arr.filter(x=>x>=1).length;
   const tmax=dd.temperature_2m_max||[];
   const avg=tmax.length?Math.round(tmax.reduce((a,b)=>a+b,0)/tmax.length):'—';
   const c=el('div','wxc');
   c.innerHTML=`<div class="dd">${pt.n}</div><div class="sn">${rain}<small style="font-size:9px"> / ${arr.length} 天有雨</small></div><div class="tt">均高温 ${avg}°C</div>`;
   rowd.appendChild(c)});
  box.appendChild(rowd);s.appendChild(box);
 }
 if(WX.fc){
  WXP.forEach((pt,i)=>{
   const d=WX.fc[i]?.daily;if(!d)return;
   const box=el('div','wx');
   box.appendChild(el('div','wxh',`<span class="wxn">${pt.n} · 未来 7 天</span><span class="wxm">${new Date(WX.at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} 更新</span>`));
   const rowd=el('div','wxd');
   d.time.forEach((t,j)=>{
    const sn=(d.precipitation_sum||[])[j]||0;
    const c=el('div','wxc');
    c.innerHTML=`<div class="dd">${t.slice(5).replace('-','/')}</div>`+
     `<div class="sn" style="color:${sn>=10?'var(--rd)':sn>0?'var(--blu)':'var(--faint)'}">${sn>0?sn.toFixed(0):'·'}</div>`+
     `<div class="tt">${Math.round(d.temperature_2m_min[j])}/${Math.round(d.temperature_2m_max[j])}°</div>`;
    rowd.appendChild(c)});
   box.appendChild(rowd);s.appendChild(box)})}
 const n=el('p','tx');n.style.cssText='font-size:11.5px;color:var(--faint);margin:2px 0 18px';
 n.innerHTML=(WX.err?`<span style="color:var(--amb)">${WX.err}（离线或被拦截，显示的是上次缓存）</span> · `:'')+TXT.wxNote;
 s.appendChild(n)}

function bookings(){
 const v=V[st.opt],out=[];
 const ids=new Set(); v.days.forEach(d=>d.stops.forEach(x=>x.p&&ids.add(x.p)));
 if(ids.has('yyc')) out.push({id:'air',n:'机票 · YVR ⇄ YYC',t:'交通'},{id:'car',n:'租车（注意异地还车费）',t:'交通'});
 if(ids.has('moraine')||ids.has('parkride'))
   out.push({id:'shuttle',n:'Moraine Lake 班车预约（最要紧）',t:'预约'});
 out.push({id:'park',n:'国家公园门票 / Canada Strong Pass 确认',t:'门票'});
 if(ids.has('icefield')) out.push({id:'icefield',n:'哥伦比亚冰原 冰上车',t:'门票'});
 if(ids.has('maligne')) out.push({id:'maligne',n:'Maligne Lake 游船',t:'门票'});
 if(ids.has('kicking')||ids.has('sunshine')) out.push({id:'ski',n:'雪票（SkiBig3 / Kicking Horse）',t:'雪票'},{id:'gear',n:'雪具租赁',t:'装备'});
 const strip=x=>String(x||'').replace(/\s?[①②③④⑤⑥⑦⑧⑨⑩⑪]/g,'').trim();
 [...new Set(v.days.map(d=>strip(d.stay)).filter(x=>x&&x!=='—'&&x!=='机上'))]
   .forEach(x=>out.push({id:'stay-'+x,n:'住宿 · '+x,t:'住宿'}));
 if(ids.has('farmfire')||ids.has('joey')) out.push({id:'dine',n:'餐厅订位（Farm and Fire / JOEY）',t:'餐饮'});
 out.push({id:'ins',n:'旅行保险 / 道路救援',t:'其他'});
 return out}

async function bkSet(id,rec){st.bk=st.bk||{};

function icsDate(dstr,mmdd){
 const y=(dstr.match(/(\d{4})/)||[])[1]||'2027';
 const m=mmdd.split('.');return `${y}${m[0]}${m[1]}`}
function toICS(){
 const v=V[st.opt];
 const pad=n=>String(n).padStart(2,'0');
 const nx=d=>{const t=new Date(d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8)+'T00:00:00Z');
  t.setUTCDate(t.getUTCDate()+1);return `${t.getUTCFullYear()}${pad(t.getUTCMonth()+1)}${pad(t.getUTCDate())}`};
 let out='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//automne//ZH\r\nCALSCALE:GREGORIAN\r\n';
 v.days.forEach((d,i)=>{
  const info=dayInfo(v,i);
  if(!info.iso) return;
  const ds=info.iso.replace(/-/g,'');
  const esc2=t=>String(t).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const body=[d.note||'',...d.stops.map(x=>`${x.t} ${x.n}${x.s?' — '+x.s:''}`)].filter(Boolean).join('\n');
  out+='BEGIN:VEVENT\r\n'+`UID:automne-${st.opt}-${i}@local\r\n`+`DTSTAMP:${ds}T000000Z\r\n`+
   `DTSTART;VALUE=DATE:${ds}\r\nDTEND;VALUE=DATE:${nx(ds)}\r\n`+
   `SUMMARY:${esc2(''+d.t)}\r\n`+
   (d.stay&&d.stay!=='—'?`LOCATION:${esc2(d.stay)}\r\n`:'')+
   `DESCRIPTION:${esc2(body)}\r\n`+'END:VEVENT\r\n'});
 out+='END:VCALENDAR\r\n';
 const b=new Blob([out],{type:'text/calendar;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download=`automne-${st.opt}.ics`;document.body.appendChild(a);a.click();

const WD=['日','一','二','三','四','五','六'];
function planStart(v){ return (st.starts&&st.starts[v.k]) || v.start || '2026-08-27'; }
function dayInfo(v,i){

/* ═══════ 6.8 变色窗口 ═══════ */
const AX0='09-01', AX1='10-31';
function md2n(m){const a=m.split('-');return (+a[0]-9)*31 + (+a[1]);}
const AXN0=md2n(AX0), AXN1=md2n(AX1), AXSP=AXN1-AXN0;
const axp=m=>((md2n(m)-AXN0)/AXSP*100);
function tripMD(v,i){const x=dayInfo(v,i); return x.iso? x.iso.slice(5) : null;}
/* 当前行程与某条窗口的重叠天数 */
function overlapDays(v,pk){
  const a=tripMD(v,0), b=tripMD(v,v.days.length-1);
  if(!a||!b) return 0;
  const s1=md2n(a), e1=md2n(b), s2=md2n(pk.a), e2=md2n(pk.b);
  return Math.max(0, Math.min(e1,e2)-Math.max(s1,s2)+1);
}
function peakBlock(s){
  const v=V[st.opt];
  const box=el('div','quota');
  const chart=el('div','pkchart');
  // 月份网格
  const grid=el('div','pkgrid');
  [['09-01','9月'],['09-16','9月中'],['10-01','10月'],['10-16','10月中']].forEach(([m,lab])=>{
    const g=el('div','pkg'); g.style.left=axp(m)+'%';
    g.appendChild(el('span',null,lab)); grid.appendChild(g)});
  chart.appendChild(grid);
  // 行程区间竖带
  const a=tripMD(v,0), b=tripMD(v,v.days.length-1);
  if(a&&b){
    const band=el('div','pkband');
    band.style.left=axp(a)+'%'; band.style.width=Math.max(1.2,axp(b)-axp(a))+'%';
    chart.appendChild(band);
  }
  // 四条窗口
  PEAK.forEach(pk=>{
    const row=el('div','pkrow');
    row.appendChild(el('span','pkn',pk.n));
    const track=el('div','pktrack');
    const e=el('div','pkbar early'); e.style.left=axp(pk.ea)+'%';
    e.style.width=(axp(pk.eb)-axp(pk.ea))+'%'; e.style.setProperty('--pc',pk.c);
    const h=el('div','pkbar peak'); h.style.left=axp(pk.a)+'%';
    h.style.width=(axp(pk.b)-axp(pk.a))+'%'; h.style.setProperty('--pc',pk.c);
    track.appendChild(e); track.appendChild(h);
    const ov=overlapDays(v,pk);
    const tot=v.days.length;
    const tag=el('span','pkov'+(ov>=Math.min(4,tot)?' good':ov>0?' mid':' bad'));
    tag.textContent=ov>0?ov+' 天重叠':'不重叠';
    row.appendChild(track); row.appendChild(tag);
    if(pk.k===st.opt) row.classList.add('on');
    box.appendChild(row);
  });
  box.insertBefore(chart,box.firstChild);
  const cur=PEAK.find(x=>x.k===st.opt);
  const ov=cur?overlapDays(v,cur):0;
  const nt=el('div','qnote'+(ov>=4?'':' warn'));
  nt.textContent = ov>=4
    ? `当前线路与它的高峰期重叠 ${ov} 天，时机合适。`
    : ov>0 ? `当前线路只与高峰期重叠 ${ov} 天，偏早或偏晚，颜色可能没到最好。`
           : `当前线路与它的高峰期完全不重叠。换日期，或换一条线。`;
  box.appendChild(nt);
  s.appendChild(box);
}

function quota(){
  const v=V[st.opt];
  const h=v.days.map(d=>d.drive==null?0:d.drive);

  const longest=Math.max(...h,0);
  const hard=h.filter(x=>x>5).length;
  return{total:Math.round(total*10)/10,longest,hard,
    avg:h.length?(total/h.length).toFixed(1):'0',ok:hard===0,series:h};
}

/* ── 地名查询串：优先用日文名 + 地区，避免同名 ── */

const LK2={
  /* 用地名搜索：落在真实的地点卡片上（含营业时间、评价、照片） */
  map:  p=>`https://www.google.com/maps/search/?api=1&query=${gquery(p)}`,

  pin:  p=>`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`,

  tabelog: q=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,

/* ── 小红书：手机上先试 App，1.2 秒没跳走就打开网页 ── */
const IS_MOBILE=/Android|iPhone|iPad|iPod|HarmonyOS/i.test(navigator.userAgent);
function openXHS(kw){
  const web=LK2.xhsWeb(kw);
  if(!IS_MOBILE){ window.open(web,'_blank','noopener'); return; }
  let gone=false;
  const mark=()=>{gone=true};
  document.addEventListener('visibilitychange',mark,{once:true});
  window.addEventListener('pagehide',mark,{once:true});
  const t=setTimeout(()=>{
    document.removeEventListener('visibilitychange',mark);
    if(!gone) window.location.href=web;
  },1200);
  try{ window.location.href='xhsdiscover://search/result?keyword='+encodeURIComponent(kw); }
  catch(e){ clearTimeout(t); window.location.href=web; }
}

/* ── 地理编码：Nominatim（OpenStreetMap）
   使用条款 https://operations.osmfoundation.org/policies/nominatim/
   志愿者服务器，无可用性保证。本实现：每秒最多 1 次、结果缓存、不做批量。
   数据 © OpenStreetMap contributors（ODbL）。 ── */
let geoAt=0, geoBusy=false;
async function geoSearch(q){
  const key='geo:'+q.toLowerCase().trim();
  const hit=await S.get(key); if(hit) return hit;
  if(geoBusy) return null;
  geoBusy=true;
  try{
    const wait=Math.max(0,1100-(Date.now()-geoAt));
    if(wait) await new Promise(r=>setTimeout(r,wait));
    geoAt=Date.now();
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5'
      +'&accept-language=zh-CN,ja,en&q='+encodeURIComponent(q));
    if(!r.ok) throw new Error('geo '+r.status);
    const j=await r.json();
    const out=j.map(x=>({name:x.display_name,lat:+x.lat,lng:+x.lon,kind:x.type||''}));
    await S.set(key,out);
    return out;
  }catch(e){ return null; }
  finally{ geoBusy=false; }
}
/* ── 粘贴谷歌地图链接 / 坐标，直接抽出经纬度 ── */
function parseCoords(t){
  t=String(t||'');
  let m=t.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/);            if(m) return{lat:+m[1],lng:+m[2]};
  m=t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);               if(m) return{lat:+m[1],lng:+m[2]};
  m=t.match(/[?&](?:q|ll|daddr|destination)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/); if(m) return{lat:+m[1],lng:+m[2]};
  m=t.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,，]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);          if(m) return{lat:+m[1],lng:+m[2]};
  return null;
}

  if(!st.me.name) return meM(()=>addM(pre));
  openM(`<h3>添加地点</h3>
   <p class="mp">三种方式：搜名字、粘贴谷歌地图链接、或在地图上长按取点。</p>
   <div class="fd"><label class="lb">① 搜名字</label>
     <div style="display:flex;gap:6px"><input type="text" id="gq" placeholder="例：Lookout Trail / Route 362"
       style="flex:1"><button class="btn" id="gbtn" style="flex:0 0 auto">搜索</button></div>
     <div id="gres"></div>
     <div class="tiny">地理编码来自 OpenStreetMap Nominatim，志愿者服务器，每秒限一次，偶尔搜不到。
       搜不到就用②或③。数据 © OpenStreetMap contributors</div>
   </div>
   <div class="fd"><label class="lb">② 粘贴谷歌地图链接 / 坐标</label>
     <input type="text" id="gpaste" placeholder="粘贴分享链接，或 34.6659,135.5011"></div>
   <div class="fd"><label class="lb">名字</label><input type="text" id="an" maxlength="40"
     value="${pre&&pre.name?esc(pre.name):''}" placeholder="显示在地图上的名字"></div>
   <div class="fd"><label class="lb">为什么想去</label><textarea id="ad" maxlength="200"
     placeholder="小红书看到的 / 朋友推荐 / 想拍的机位"></textarea></div>
   <div class="row"><div class="fd"><label class="lb">纬度</label>
     <input type="number" id="alat" step="0.00001" value="${pre?pre.lat.toFixed(5):''}"></div>
     <div class="fd"><label class="lb">经度</label>
     <input type="number" id="alng" step="0.00001" value="${pre?pre.lng.toFixed(5):''}"></div></div>
   <div class="row" style="margin-top:5px"><button class="btn" data-close>取消</button>
     <button class="btn pri" id="as">加进地图</button></div>`,
  b=>{
    const $q=b.querySelector('#gq'), $res=b.querySelector('#gres'),
          $lat=b.querySelector('#alat'), $lng=b.querySelector('#alng'), $an=b.querySelector('#an');
    const setPt=(lat,lng,nm)=>{$lat.value=(+lat).toFixed(5);$lng.value=(+lng).toFixed(5);
      if(nm&&!$an.value.trim())$an.value=nm};
    async function run(){
      const q=$q.value.trim(); if(q.length<2) return toast('至少两个字');
      $res.innerHTML='<div class="tiny">搜索中…</div>';
      const rs=await geoSearch(q);
      $res.innerHTML='';
      if(!rs){ $res.innerHTML='<div class="tiny warn">没搜到，或服务暂时不可用。用②粘贴链接更稳。</div>'; return }
      if(!rs.length){ $res.innerHTML='<div class="tiny warn">没有结果。换个写法，或加上城市名。</div>'; return }
      rs.forEach(x=>{
        const r=el('button','gitem');
        const short=x.name.split(',').slice(0,3).join(',');
        r.innerHTML=`<span class="gn">${esc(short)}</span><span class="gk">${esc(x.kind)}</span>`;
        r.onclick=ev=>{ev.preventDefault();setPt(x.lat,x.lng,short.split(',')[0].trim());
          $res.querySelectorAll('.gitem').forEach(z=>z.classList.remove('on'));
          r.classList.add('on'); toast('已取点')};
        $res.appendChild(r)});
    }
    b.querySelector('#gbtn').onclick=run;
    $q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();run()}});
    b.querySelector('#gpaste').addEventListener('input',e=>{
      const c=parseCoords(e.target.value);
      if(c){ setPt(c.lat,c.lng); toast('已从链接取到坐标') }});
    $an.focus();
    b.querySelector('#as').onclick=async()=>{
      const n=$an.value.trim();
      const la=parseFloat($lat.value), ln=parseFloat($lng.value);
      if(!n) return toast('起个名字');
      if(isNaN(la)||isNaN(ln)) return toast('还没有坐标 — 用上面三种方式之一取一个');
      st.pins.push({id:uid(),name:n,note:b.querySelector('#ad').value.trim(),lat:la,lng:ln,
        by:st.me.name,byId:st.me.id,color:st.me.color,likes:[],at:Date.now()});
      closeM(); st.tab=PLACE_TAB; renderTabs(); renderBody(); drawPin();
      if(typeof mapOK==='undefined'||mapOK) try{map.flyTo([la,ln],13,{duration:.7})}catch(e){}
      await push(); toast('加好了，同行的人也能看到');
    };
  });
}

/* ═══════ 9. 协作 ═══════ */
async function pull(loud){
  $('#syncDot').className='dot busy';
  const [p,m,bk,nt]=await Promise.all([S.get(K.pins(),true),S.get(K.mem(),true),
    S.get(K.bk(),true),S.get(K.notes(),true)]);
  if(Array.isArray(p))st.pins=p;if(Array.isArray(m))st.members=m;
  if(bk&&typeof bk==='object')st.bk=bk;if(nt&&typeof nt==='object')st.notes=nt;
  $('#syncDot').className=S.ok?'dot':'dot off';
  renderMem();renderTabs();if(st.tab==='spots')renderBody();drawPin();
  if(loud)toast(S.ok?`已同步 · ${st.pins.length} 个点`:'当前环境没有共享存储，改动只留在本次会话')}
async function push(){$('#syncDot').className='dot busy';await S.set(K.pins(),st.pins,true);$('#syncDot').className=S.ok?'dot':'dot off'}
async function join(){if(!st.me.id)return;const m=await S.get(K.mem(),true)||[];
  const i=m.findIndex(x=>x.id===st.me.id),rec={id:st.me.id,name:st.me.name,color:st.me.color,at:Date.now()};
  if(i>=0)m[i]=rec;else m.push(rec);st.members=m;await S.set(K.mem(),m,true);renderMem()}
function drop(ll){if(!st.me.name){meM(()=>drop(ll));return}addM({lat:ll.lat,lng:ll.lng})}
async function like(id){if(!st.me.id)return meM();const p=st.pins.find(x=>x.id===id);if(!p)return;
  p.likes=p.likes||[];const i=p.likes.indexOf(st.me.id);if(i>=0)p.likes.splice(i,1);else p.likes.push(st.me.id);
  renderBody();drawPin();await push()}
async function del(id){st.pins=st.pins.filter(p=>p.id!==id);renderTabs();renderBody();drawPin();await push();toast('已删除')}

/* ═══════ 10. 弹窗 ═══════ */
function openM(h,fn){const b=$('#mbox');b.innerHTML=h;$('#modal').classList.add('show');fn&&fn(b);
  b.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeM)}
const closeM=()=>$('#modal').classList.remove('show');
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
function meM(after){
  openM(`<h3>你是谁</h3><p class="mp">名字会跟在你加的每个点后面，这样才知道是谁想去的。</p>
   <div class="fd"><label class="lb">名字</label><input type="text" id="mn" maxlength="12" value="${esc(st.me.name)}" placeholder="比如 小K"></div>
   <div class="fd"><label class="lb">颜色</label><div id="cw" style="display:flex;gap:7px;flex-wrap:wrap"></div></div>
   <div class="row" style="margin-top:15px"><button class="btn" data-close>取消</button><button class="btn pri" id="ms">保存</button></div>`,
  b=>{const cw=b.querySelector('#cw');
   AVC.forEach(c=>{const d=el('button');d.style.cssText=`width:25px;height:25px;border-radius:7px;background:${c};border:2px solid ${st.me.color===c?'#0F151C':'transparent'}`;
    d.onclick=()=>{st.me.color=c;meM(after)};cw.appendChild(d)});
   b.querySelector('#mn').focus();
   b.querySelector('#ms').onclick=async()=>{const n=b.querySelector('#mn').value.trim();
    if(!n)return toast('填个名字');st.me.name=n;st.me.id=st.me.id||uid();
    closeM();save();await join();renderMem();toast('已加入 '+st.room);after&&after()}})}
function roomM(){
  openM(`<h3>行程码</h3><p class="mp">同一个码就是同一份地图。换一个没人用过的码，会得到一份全新的空白行程。</p>
   <div class="fd"><label class="lb">当前</label><input type="text" id="rc" maxlength="24" value="${esc(st.room)}"></div>
   <p class="mp" style="font-size:11.5px;color:var(--faint)">只能用字母数字和短横线。知道这个码的人都能看到里面的内容。</p>
   <div class="row"><button class="btn" data-close>取消</button><button class="btn pri" id="rs">切换</button></div>`,
  b=>{b.querySelector('#rs').onclick=async()=>{
   const v=b.querySelector('#rc').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
   if(v.length<3)return toast('至少 3 个字符');
   st.room=v;closeM();save();st.pins=[];st.members=[];await pull();await join();toast('已切到 '+v)}})}
function bkModal(b){
 if(!st.me.name)return meM(()=>bkModal(b));
 const r=bkGet(b.id)||{};
 openM(`<h3>${esc(b.n)}</h3><p class="mp">订好了就填确认号，没订就留空关掉。两个人共享。</p>
  <div class="fd"><label class="lb">确认号 / 订单号</label><input type="text" id="bref" maxlength="60" value="${esc(r.ref||'')}" placeholder="例如 ABC123 或 Booking #99887"></div>
  <div class="fd"><label class="lb">实付金额 CAD（两人合计）</label><input type="number" id="bamt" step="1" value="${r.amt||''}" placeholder="0"></div>
  <div class="row"><button class="btn" id="bclr">标为未订</button><button class="btn pri" id="bok">标为已订</button></div>
  <div class="row" style="margin-top:7px"><button class="btn" data-close>取消</button></div>`,
 x=>{x.querySelector('#bref').focus();
  x.querySelector('#bok').onclick=async()=>{
   await bkSet(b.id,{state:'ok',ref:x.querySelector('#bref').value.trim(),
    amt:+x.querySelector('#bamt').value||0,by:st.me.name,at:new Date().toISOString().slice(0,10)});
   closeM();toast('已记下')};
  x.querySelector('#bclr').onclick=async()=>{await bkSet(b.id,null);closeM();toast('已清除')}})}
function exJ(){const d={room:st.room,opt:st.opt,pins:st.pins,budget:st.budget,done:st.done,rate:st.rate};
 openM(`<h3>导出</h3><p class="mp">复制走，可以粘回任何一个行程码。</p>
  <textarea id="ex" style="height:220px;font-family:var(--mono);font-size:11px">${esc(JSON.stringify(d,null,2))}</textarea>
  <div class="row" style="margin-top:11px"><button class="btn" data-close>关闭</button><button class="btn pri" id="cp">复制</button></div>`,
 b=>{b.querySelector('#cp').onclick=async()=>{const ta=b.querySelector('#ex');
  try{await navigator.clipboard.writeText(ta.value)}catch(e){ta.select();try{document.execCommand('copy')}catch(_){return toast('复制失败，手动全选')}}
  toast('已复制')}})}
function imJ(){openM(`<h3>导入</h3><p class="mp">粘贴一份导出的 JSON，会覆盖当前行程码下的点位和预算。</p>
  <textarea id="im" style="height:190px;font-family:var(--mono);font-size:11px"></textarea>
  <div class="row" style="margin-top:11px"><button class="btn" data-close>取消</button><button class="btn pri" id="io">导入</button></div>`,
 b=>{b.querySelector('#io').onclick=async()=>{try{const d=JSON.parse(b.querySelector('#im').value);
  if(Array.isArray(d.pins))st.pins=d.pins;if(d.budget)st.budget=d.budget;if(d.done)st.done=d.done;
  if(d.opt&&V[d.opt])st.opt=d.opt;if(d.rate)st.rate=d.rate;
  closeM();renderOpts();renderTabs();renderBody();drawPl();drawPin();await push();save();toast('导入完成')}
  catch(e){toast('JSON 格式不对')}}})}

/* ═══════ 11. 本地配置 ═══════ */
let sT;const save=()=>{clearTimeout(sT);sT=setTimeout(()=>S.set(K.cfg(),
 {room:st.room,opt:st.opt,me:st.me,budget:st.budget,done:st.done,rate:st.rate,perPerson:st.perPerson,ccy:st.ccy}),320)};
async function load(){const c=await S.get(K.cfg());if(!c)return;
 st.room=c.room||st.room;st.opt=V[c.opt]?c.opt:'A';st.me=c.me||st.me;
 st.budget=c.budget||{};st.done=c.done||{};st.rate=c.rate||115;
 st.perPerson=!!c.perPerson;st.ccy=c.ccy||'CAD'}

/* ═══════ 12. 手机抽屉 ═══════ */
const SNAP=[0.14,0.55,0.90];let si=1,spx=0;const VH=()=>innerHeight;
function snap(i){if(innerWidth>900)return;si=Math.max(0,Math.min(2,i));spx=SNAP[si]*VH();
 document.documentElement.style.setProperty('--sheet-h',spx+'px')}
(function(){const p=$('#panel'),g=$('#grab'),sc=$('#scroll');
 let y0=0,h0=0,dr=false,mv=false;
 const st_=e=>{if(innerWidth>900)return;dr=true;mv=false;p.classList.add('dragging');
   y0=e.touches?e.touches[0].clientY:e.clientY;h0=spx||SNAP[si]*VH()};
 const mo=e=>{if(!dr)return;const y=e.touches?e.touches[0].clientY:e.clientY;
   if(Math.abs(y-y0)>3){mv=true;if(e.cancelable)e.preventDefault()}
   spx=Math.max(70,Math.min(VH()*.92,h0-(y-y0)));
   document.documentElement.style.setProperty('--sheet-h',spx+'px')};
 const en=()=>{if(!dr)return;dr=false;p.classList.remove('dragging');
   if(!mv){snap(si===2?1:2);return}
   const fr=spx/VH();let bs=0,bd=Infinity;SNAP.forEach((s,i)=>{const d=Math.abs(s-fr);if(d<bd){bd=d;bs=i}});snap(bs)};
 g.addEventListener('touchstart',st_,{passive:true});g.addEventListener('touchmove',mo,{passive:false});
 g.addEventListener('touchend',en);g.addEventListener('mousedown',st_);
 addEventListener('mousemove',mo);addEventListener('mouseup',en);
 let sy=0;sc.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
 sc.addEventListener('touchmove',e=>{if(innerWidth>900)return;
   if(sc.scrollTop<=0&&e.touches[0].clientY-sy>64&&si>0){snap(si-1);sy=e.touches[0].clientY}},{passive:true})})();

/* ═══════ 13. 启动 ═══════ */
$('#baseBtn').onclick=()=>{if(mapOK)setBase((bi+1)%BASES.length)};
$('#allBtn').onclick=showAll;$('#addBtn').onclick=()=>setAdd(!adding);
$('#roomBtn').onclick=roomM;$('#dateBtn').onclick=dateModal;$('#meBtn').onclick=()=>meM();
addEventListener('resize',()=>{if(innerWidth>900)document.documentElement.style.removeProperty('--sheet-h');else snap(si);
  setTimeout(()=>mapOK&&map.invalidateSize(),120)});
addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();if(adding)setAdd(false)}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});}
(async function(){
  await load();initMap();
  renderOpts();renderTabs();renderBody();renderMem();drawPl();showAll();
  await pull();if(st.me.id)join();snap(1);
  loadWX().then(()=>{if(st.tab==='plan')renderBody()});
  setInterval(()=>{if(document.visibilityState==='visible')pull()},9000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
  if(!S.ok)$('#syncDot').className='dot off';
  setTimeout(()=>mapOK&&map.invalidateSize(),200)})();
</script>
</body>
</html>

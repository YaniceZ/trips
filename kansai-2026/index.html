<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C121C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>関西・四国・熊野 — 2026.09.17 → 10.06</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0C121C; --surface:#121A28; --surface-2:#182234; --surface-3:#1F2B40;
  --line:#26334C; --line-soft:#1C2537;
  --text:#EAE8E2; --dim:#94A1B7; --faint:#61708A;
  --shu:#E2452F;   /* 朱 — 関西 */
  --ai:#4C9CC4;    /* 藍 — 四国 */
  --iou:#D89B2E;   /* 硫黄 — 九州 */
  --sugi:#57946F;  /* 杉 — 熊野 */
  --kin:#C9A227;
  --disp:'Shippori Mincho','Noto Serif SC',serif;
  --body:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sheet-h:55vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);font-weight:300;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px;border-radius:3px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--surface)}
::-webkit-scrollbar-thumb:hover{background:var(--surface-3)}

/* ─────────── shell ─────────── */
#app{display:flex;flex-direction:column;height:100%;height:100dvh;overflow:clip}
header{
  flex:0 0 auto;background:var(--ink);border-bottom:1px solid var(--line-soft);
  padding:12px 18px 0;position:relative;z-index:1200;
  padding-top:calc(12px + env(safe-area-inset-top));
}
.hrow{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{flex:1 1 auto;min-width:200px}
.brand h1{
  font-family:var(--disp);font-weight:800;font-size:21px;margin:0;letter-spacing:.06em;line-height:1.2;
}
.brand h1 em{font-style:normal;color:var(--shu)}
.brand .sub{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--faint);
  text-transform:uppercase;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center
}
.brand .sub b{color:var(--dim);font-weight:500}

/* room + members */
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:2px}
.chip{
  display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--dim);
  transition:border-color .18s,color .18s
}
.chip:hover{border-color:var(--surface-3);color:var(--text)}
.chip b{color:var(--text);font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sugi);flex:none}
.dot.off{background:var(--faint)}
.dot.busy{background:var(--kin);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.avatars{display:flex}
.av{
  width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;font-weight:700;color:#0C121C;
  border:2px solid var(--ink);margin-left:-7px;flex:none
}
.av:first-child{margin-left:0}

/* ─────────── seal switcher (signature) ─────────── */
.seals{display:flex;gap:9px;padding:13px 0 12px;overflow-x:auto;scrollbar-width:none}
.seals::-webkit-scrollbar{display:none}
.seal{
  flex:none;position:relative;display:flex;align-items:center;gap:11px;
  padding:9px 15px 9px 9px;border:1px solid var(--line);border-radius:11px;
  background:var(--surface);transition:border-color .2s,background .2s,transform .2s;text-align:left
}
.seal:hover{border-color:var(--surface-3);background:var(--surface-2)}
.seal[aria-pressed=true]{border-color:var(--sc);background:var(--surface-2)}
.seal[aria-pressed=true]:after{
  content:'';position:absolute;inset:-1px;border-radius:11px;border:1px solid var(--sc);opacity:.4;pointer-events:none
}
.seal .mark{
  width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.02em;
  border:1.5px solid var(--sc);color:var(--sc);background:color-mix(in srgb,var(--sc) 10%,transparent);
  transition:background .2s,color .2s
}
.seal[aria-pressed=true] .mark{background:var(--sc);color:#0C121C}
.seal .lab{display:block;font-size:13px;font-weight:500;letter-spacing:.02em;white-space:nowrap;line-height:1.35}
.seal .met{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint);
  text-transform:uppercase;white-space:nowrap;margin-top:1px
}
.seal[aria-pressed=true] .met{color:var(--dim)}

/* ─────────── main ─────────── */
main{flex:1 1 auto;display:flex;min-height:0;position:relative;overflow:clip}
#map{flex:1 1 auto;min-width:0;background:#0A0F17;z-index:1}
#panel{
  flex:0 0 428px;background:var(--surface);border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;min-height:0;z-index:2
}
.tabs{
  flex:0 0 auto;display:flex;border-bottom:1px solid var(--line-soft);background:var(--surface);
  padding:0 6px;gap:2px;overflow-x:auto;scrollbar-width:none
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 1 auto;padding:13px 6px 11px;font-size:12.5px;letter-spacing:.06em;color:var(--faint);
  border-bottom:2px solid transparent;transition:color .18s,border-color .18s;white-space:nowrap;font-weight:400
}
.tab:hover{color:var(--dim)}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--shu);font-weight:500}
.tab .n{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-left:4px}
.scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:18px 18px 60px}
.scroll::-webkit-scrollbar-thumb{border-color:var(--surface)}

/* ─────────── typography bits ─────────── */
h2.sec{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  margin:0 0 12px;font-weight:500;display:flex;align-items:center;gap:10px
}
h2.sec:after{content:'';flex:1;height:1px;background:var(--line-soft)}
h2.sec+ h2.sec{margin-top:26px}
.lede{font-size:13.5px;color:var(--dim);line-height:1.75;margin:0 0 18px}
.lede strong{color:var(--text);font-weight:500}

/* ─────────── typhoon band ─────────── */
.risk{margin:0 0 22px}
.riskbar{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line-soft)}
.riskseg{flex:1;display:grid;place-items:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:#0C121C;font-weight:700}
.risklab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--faint);margin-top:6px;text-transform:uppercase}

/* ─────────── itinerary spine (signature) ─────────── */
.spine{position:relative;padding-left:34px}
.spine:before{content:'';position:absolute;left:12px;top:14px;bottom:20px;width:1px;background:var(--line)}
.day{position:relative;margin-bottom:6px}
.daybtn{
  width:100%;text-align:left;padding:12px 13px;border-radius:10px;border:1px solid transparent;
  transition:background .18s,border-color .18s;display:block
}
.daybtn:hover{background:var(--surface-2)}
.day.open .daybtn{background:var(--surface-2);border-color:var(--line)}
.node{
  position:absolute;left:-28px;top:16px;width:19px;height:19px;border-radius:50%;
  border:1.5px solid var(--nc);background:var(--surface);display:grid;place-items:center;
  font-family:var(--mono);font-size:8.5px;font-weight:700;color:var(--nc);z-index:2;transition:background .2s,color .2s
}
.day.open .node{background:var(--nc);color:#0C121C}
.dhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.ddate{font-family:var(--mono);font-size:10px;letter-spacing:.11em;color:var(--faint);text-transform:uppercase}
.dtitle{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:.03em;flex:1 1 100%;margin-top:2px}
.dnote{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.6}
.dmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pill{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;padding:3px 8px;border-radius:5px;
  background:var(--surface-3);color:var(--dim);text-transform:uppercase
}
.pill.stay{background:color-mix(in srgb,var(--nc) 16%,transparent);color:var(--nc)}
.dbody{display:none;padding:2px 13px 16px}
.day.open .dbody{display:block}
.stop{
  display:flex;gap:11px;padding:8px 0;border-top:1px solid var(--line-soft);width:100%;text-align:left;
  transition:opacity .15s
}
.stop:hover{opacity:.72}
.stop .t{font-family:var(--mono);font-size:10px;color:var(--faint);flex:0 0 46px;padding-top:3px;letter-spacing:.05em}
.stop .n{font-size:13px;font-weight:400;line-height:1.5}
.stop .n small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px;line-height:1.5}
.stop .n .jp{font-family:var(--disp);color:var(--dim);font-size:11.5px;letter-spacing:.04em}

/* ─────────── place cards ─────────── */
.pcard{
  border:1px solid var(--line-soft);border-radius:10px;padding:12px 13px;margin-bottom:8px;
  background:var(--surface-2);transition:border-color .18s;position:relative
}
.pcard:hover{border-color:var(--line)}
.pcard .top{display:flex;align-items:flex-start;gap:10px}
.pcard .swatch{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px;background:var(--pc)}
.pcard h3{margin:0;font-size:14px;font-weight:500;line-height:1.45;flex:1}
.pcard h3 .jp{font-family:var(--disp);color:var(--faint);font-size:11.5px;margin-left:6px;letter-spacing:.04em}
.pcard p{margin:6px 0 0;font-size:12.5px;color:var(--dim);line-height:1.65}
.pcard .foot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.byline{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.06em}
.mini{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font-size:7.5px;font-weight:700;color:#0C121C;font-family:var(--mono)}
.act{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:4px 8px;border-radius:5px;
  border:1px solid var(--line);color:var(--faint);transition:.15s;text-transform:uppercase
}
.act:hover{border-color:var(--surface-3);color:var(--text)}
.act.on{border-color:var(--shu);color:var(--shu);background:color-mix(in srgb,var(--shu) 10%,transparent)}
.act.del:hover{border-color:var(--shu);color:var(--shu)}

/* ─────────── forms ─────────── */
.field{margin-bottom:13px}
label.lb{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--faint);
  text-transform:uppercase;margin-bottom:5px
}
input[type=text],input[type=number],select,textarea{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  font-size:13.5px;font-weight:300;transition:border-color .18s
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--surface-3)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px;background-size:5px 5px;background-repeat:no-repeat}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border-radius:8px;
  border:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  color:var(--dim);transition:.18s;text-transform:uppercase
}
.btn:hover{border-color:var(--surface-3);color:var(--text);background:var(--surface-2)}
.btn.pri{background:var(--shu);border-color:var(--shu);color:#0C121C;font-weight:700}
.btn.pri:hover{background:#EF5A43;border-color:#EF5A43;color:#0C121C}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}

/* ─────────── budget ─────────── */
.btot{
  border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;background:var(--surface-2);
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap
}
.btot .big{font-family:var(--mono);font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--kin)}
.btot .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
.btot .side{text-align:right}
.btot .side div{font-family:var(--mono);font-size:12px;color:var(--dim)}
.bline{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.bline .lr{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bline .nm{font-size:13.5px;font-weight:400}
.bline .nm small{display:block;color:var(--faint);font-size:11px;margin-top:1px}
.bline .vv{font-family:var(--mono);font-size:13.5px;color:var(--kin);white-space:nowrap;font-weight:500}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);border-radius:2px;margin:12px 0 2px
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--kin);cursor:grab;border:3px solid var(--surface)
}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--kin);cursor:grab;border:3px solid var(--surface)}

/* ─────────── checklist ─────────── */
.todo{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start;width:100%;text-align:left}
.box{
  width:17px;height:17px;border:1.5px solid var(--line);border-radius:5px;flex:none;margin-top:2px;
  display:grid;place-items:center;transition:.18s
}
.todo.done .box{background:var(--sugi);border-color:var(--sugi)}
.todo.done .box:after{content:'';width:4px;height:8px;border:solid #0C121C;border-width:0 2px 2px 0;transform:rotate(43deg) translate(-1px,-1px)}
.todo.done .tx{color:var(--faint);text-decoration:line-through}
.tx{font-size:13.5px;line-height:1.55;flex:1}
.tx small{display:block;color:var(--faint);font-size:11px;margin-top:2px}
.due{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;color:var(--shu);flex:none;margin-top:3px}
.due.ok{color:var(--faint)}

/* ─────────── map overlay ─────────── */
.mapctl{
  position:absolute;top:12px;right:12px;z-index:900;display:flex;flex-direction:column;gap:6px;align-items:flex-end
}
.mbtn{
  background:rgba(18,26,40,.93);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:8px;
  padding:7px 11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;color:var(--dim);
  transition:.15s;text-transform:uppercase;white-space:nowrap
}
.mbtn:hover{color:var(--text);border-color:var(--surface-3)}
.mbtn.on{color:var(--shu);border-color:var(--shu)}
.hint{
  position:absolute;left:12px;bottom:12px;z-index:900;background:rgba(18,26,40,.93);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.07em;color:var(--faint);max-width:min(70%,300px);line-height:1.6;pointer-events:none
}
.leaflet-container{background:#0A0F17;font-family:var(--body)}
.leaflet-control-attribution{background:rgba(12,18,28,.82)!important;color:var(--faint)!important;font-size:9px!important;font-family:var(--mono)!important}
.leaflet-control-attribution a{color:var(--dim)!important}
.leaflet-control-zoom a{background:rgba(18,26,40,.93)!important;color:var(--dim)!important;border-color:var(--line)!important;backdrop-filter:blur(14px)}
.leaflet-control-zoom a:hover{color:var(--text)!important;background:var(--surface-2)!important}
.leaflet-popup-content-wrapper{background:var(--surface-2);color:var(--text);border-radius:10px;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.leaflet-popup-tip{background:var(--surface-2);border:1px solid var(--line)}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.6;font-weight:300}
.leaflet-popup-content b{font-family:var(--disp);font-size:14.5px;font-weight:600;letter-spacing:.03em;display:block;margin-bottom:3px}
.leaflet-popup-content .jp{font-family:var(--disp);color:var(--faint);font-size:11.5px}
.leaflet-popup-content .mt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-top:7px;display:block}
.leaflet-popup-close-button{color:var(--faint)!important}
.pinico{display:grid;place-items:center;border-radius:50%;border:2px solid #0C121C;box-shadow:0 2px 8px rgba(0,0,0,.5);font-family:var(--mono);font-weight:700;color:#0C121C}
.pinico.num{font-size:10px}
.pinico.usr{border-radius:50% 50% 50% 2px;transform:rotate(-45deg);font-size:8.5px}
.pinico.usr span{transform:rotate(45deg)}

/* ─────────── toast ─────────── */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,90px);z-index:3000;
  background:var(--surface-3);border:1px solid var(--line);border-radius:9px;padding:10px 17px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text);
  transition:transform .32s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;box-shadow:0 12px 40px rgba(0,0,0,.5);
  max-width:88vw;text-align:center
}
#toast.show{transform:translate(-50%,0)}

/* ─────────── modal ─────────── */
#modal{position:fixed;inset:0;z-index:2500;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,10,16,.78);backdrop-filter:blur(6px)}
#modal.show{display:flex}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:400px;max-height:86vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.mbox h3{font-family:var(--disp);font-size:18px;font-weight:700;margin:0 0 4px;letter-spacing:.04em}
.mbox .mp{font-size:12.5px;color:var(--dim);margin:0 0 16px;line-height:1.65}


/* 深链行 */
.lkrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.lk2{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;
 letter-spacing:.05em;padding:4px 8px;border-radius:5px;border:1px solid var(--line);
 color:var(--dim);background:transparent;text-decoration:none;transition:.15s;white-space:nowrap}
.lk2:hover{border-color:var(--ai);color:var(--ai)}
.lk2.jp{border-style:dashed;color:var(--faint)}
.lk2.jp:hover{border-color:var(--sugi);color:var(--sugi)}
.lk2.nt:hover{border-color:var(--kin);color:var(--kin)}
/* 实地笔记 */
.notes{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.note{position:relative;background:color-mix(in srgb,var(--kin) 9%,transparent);
 border-left:2px solid var(--kin);border-radius:0 7px 7px 0;padding:8px 26px 8px 10px}
.note .nb{font-size:12.5px;line-height:1.7;color:var(--text)}
.note .nm{font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--faint);margin-top:4px}
.ndel{position:absolute;top:5px;right:7px;color:var(--faint);font-size:14px;line-height:1;padding:2px 4px}
.ndel:hover{color:var(--shu)}
/* 天气 */

<script>
/* ══════════════════════════════════════════════════════════════
   1. STORAGE ADAPTER
   Artifact 环境用 window.storage（shared:true 实现多人协作）；
   自建部署时换掉 remote() 即可接 Supabase / Firebase。
   ══════════════════════════════════════════════════════════════ */
const mem = new Map();
const S = {
  ok: typeof window.storage !== 'undefined' && window.storage,
  async get(k, shared=false){
    if(!this.ok) return mem.has(k+shared) ? mem.get(k+shared) : null;
    try{ const r = await window.storage.get(k, shared); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  },
  async set(k, v, shared=false){
    if(!this.ok){ mem.set(k+shared, v); return true; }
    try{ await window.storage.set(k, JSON.stringify(v), shared); return true; }
    catch(e){ return false; }
  }
};

/* ══════════════════════════════════════════════════════════════
   2. PLACE LIBRARY  — id, 中文名, 日文名, lat, lng, 区域, 一句话
   坐标为示意精度，导航请以实际地图为准
   ══════════════════════════════════════════════════════════════ */
const R = {
  kansai:{k:'kansai', n:'関西', c:'var(--shu)', hex:'#E2452F'},
  shikoku:{k:'shikoku', n:'四国', c:'var(--ai)', hex:'#4C9CC4'},
  kyushu:{k:'kyushu', n:'九州', c:'var(--iou)', hex:'#D89B2E'},
  kumano:{k:'kumano', n:'熊野', c:'var(--sugi)', hex:'#57946F'}
};

const P = {};
function def(id,zh,jp,lat,lng,r,note){ P[id]={id,zh,jp,lat,lng,r,note}; }

/* — 関西 — */
def('kix','关西国际机场','関西国際空港',34.4342,135.2328,'kansai','AC23 落地 16:25。南海ラピート 到难波 38 分钟，特急券要另付 520 日元；JR HARUKA 到京都 75 分钟。先在机场办 ICOCA，之后所有地铁公交都刷它。');
def('namba','难波 / 心斋桥','なんば',34.6659,135.5011,'kansai','住这一带就对了。地铁好几条线交汇，凌晨两点还有饭吃，时差乱了也不慌。');
def('kuromon','黑门市场','黒門市場',34.6653,135.5062,'kansai','八点到十点最好。十点半以后旅行团进来，很多摊只剩排队。现切海胆一份两三千日元，站着吃完就走，别找座位。');
def('dotonbori','道顿堀','道頓堀',34.6687,135.5013,'kansai','别抱期待，就是一面人很多的招牌墙。落地当晚走一圈醒神用，二十分钟够了。');
def('shinsekai','新世界 / 通天阁','新世界',34.6524,135.5063,'kansai','串カツ的酱料桶是公用的，蘸一次就不能再蘸，每家门口都写着这句。人均两千日元上下。');
def('nakanoshima','中之岛 / 北滨','中之島',34.6937,135.4970,'kansai','北滨沿河那段，老银行大楼改的咖啡馆一间接一间。工作日中午挤满上班族，周末反而空。');
def('harukas','阿倍野 Harukas 300','あべのハルカス',34.6455,135.5136,'kansai','日本最高楼，门票 2000 日元。挑日落前一小时上去，白天和夜景能一次看完。');
def('todaiji','东大寺','東大寺',34.6889,135.8399,'kansai','八点开门，八点半旅行团大巴就到。鹿饼一包 200 日元，喂之前先把地图和票收进包里，它们真的抢纸。');
def('kasuga','春日大社','春日大社',34.6815,135.8484,'kansai','社殿本身一般，值得走的是参道——三千座石灯笼夹在杉木里，光从树顶漏下来。');
def('wakakusa','若草山','若草山',34.6866,135.8494,'kansai','爬到顶三十分钟，入山费 150 日元。日落时整个奈良盆地在脚下。山门关得早，别踩着点上去。');
def('kyotobase','京都民宿基地','京都',35.0037,135.7681,'kansai','锁四条乌丸到三条这一块。走路能到锦市场和鸭川，公交往哪个方向都有。找带厨房和洗衣机的整套公寓，住满七晚一般有周租价。');
def('fushimi','伏见稻荷大社','伏見稲荷大社',34.9671,135.7727,'kansai','七点前上山，鸟居里几乎没人；八点之后是另一个地方。走到山顶来回两小时，多数人到四辻就折返了。');
def('kiyomizu','清水寺 / 二年坂','清水寺',34.9949,135.7850,'kansai','六点开门，这是京都为数不多能避开人的办法。先上舞台再下三年坂。八点旅行团开始涌，产宁坂就走不动了。');
def('arashiyama','岚山 / 竹林小径','嵐山',35.0170,135.6717,'kansai','竹林八点以后拍照基本没戏。七点半到，先竹林再天龙寺，中午前撤。渡月桥人一直很多，别指望。');
def('kinkakuji','金阁寺','金閣寺',35.0394,135.7292,'kansai','四十分钟走完，看一次就够。晴天去，阴天那栋楼没什么好看的。');
def('ginkakuji','银阁寺 / 哲学之道','銀閣寺',35.0270,135.7982,'kansai','从银阁寺沿疏水道走到南禅寺一个多小时。九月底还没红，绿荫很好。');
def('nanzenji','南禅寺水路阁','南禅寺',35.0113,135.7947,'kansai','明治年间的红砖水道桥直接架在禅寺里，是京都最不像京都的一个角落。下午四点半光线最好。');
def('nishiki','锦市场','錦市場',35.0051,135.7649,'kansai','长住的意义就在这儿。豆腐、渍物、鱼、玉子烧，买回去自己做。中段游客最多，两头才是本地人买菜的。');
def('kibune','贵船神社 / 鞍马','貴船神社',35.1214,135.7629,'kansai','出町柳坐叡山电车到鞍马，翻山走到贵船两小时，全是台阶。山里比市区低五度左右。');
def('uji','宇治 / 平等院','平等院',34.8894,135.8077,'kansai','凤凰堂就是十円硬币背面那栋。内部参拜要另外排队限时进。出来在中村藤吉本店吃碗抹茶。');
def('kobe','神户北野','北野異人館',34.7016,135.1889,'kansai','异人馆散在坡道上，走走停停两小时。傍晚去港区看夜景。');
def('arima','有马温泉','有馬温泉',34.7975,135.2478,'kansai','金汤含铁是褐色的，银汤是碳酸的，各泡一次。从京都或大阪当天来回都行。');
def('himeji','姬路城','姫路城',34.8394,134.6939,'kansai','现存唯一原构天守国宝，从站前走过来二十分钟。爬天守要脱鞋，台阶又陡又窄，人多时排很久。整天给它不亏。');
def('koyasan','高野山 奥之院','高野山 奥之院',34.2166,135.5946,'kansai','二十万座墓塔埋在杉木参道里，走进去两公里。可以住宿坊，早上跟着做早课，吃精进料理。');
def('miho','美秀美术馆','MIHO MUSEUM',34.9152,136.0126,'kansai','贝聿铭那条穿山隧道才是主角。周一闭馆，而且有休展期，从京都单程一个半小时——去之前务必查当天开不开。');
def('rinku','临空 Premium Outlets','りんくうプレミアム・アウトレット',34.4106,135.2989,'kansai','离关西机场一站。最后一天清库存刚好，行李超重也是在这儿发生的。');

/* — 四国 — */
def('akashi','明石海峡大桥','明石海峡大橋',34.6167,135.0206,'shikoku','桥上不能停车。淡路 SA 有观景台，从那儿看最完整。');
def('awaji','淡路岛 伊弉诺神宫','伊弉諾神宮',34.4614,134.8556,'shikoku','日本创世神话的起点，规模不大，停四十分钟够。');
def('naruto','鸣门涡潮','鳴門の渦潮',34.2385,134.6449,'shikoku','涡潮只在特定潮时出现，一天就两个窗口。先查涡潮时刻表，当天几点到完全由它决定。要么坐观潮船，要么走渦の道从桥下玻璃地板往下看。');
def('otsuka','大冢国际美术馆','大塚国際美術館',34.2410,134.6382,'shikoku','1000 多幅等大陶板复制画，门票 3300 日元。认真看四小时，只有三小时就直奔地下三层的西斯廷礼拜堂复原。');
def('tokushima','德岛市','徳島市',34.0704,134.5548,'shikoku','阿波舞会馆有常设演出，眉山缆车上去看夜景。德岛拉面是浓口酱油底，上面打一颗生鸡蛋。');
def('oboke','大步危峡','大歩危峡',33.8672,133.7969,'shikoku','吉野川切出来的峡谷。观光船三十分钟，赶时间的话只在展望台停十分钟也行。');
def('kazura','祖谷蔓桥','祖谷のかずら橋',33.8615,133.8408,'shikoku','葛藤编的吊桥，脚下的缝能直接看到河水，走过去腿会软。门票 550 日元。停车场很小，中午会排队。');
def('iyaonsen','祖谷温泉','ホテル祖谷温泉',33.8783,133.8079,'shikoku','坐缆车垂直降到谷底泡露天风吕。全程住得最贵的一晚，也是最值的一晚。山路窄弯多，天黑前一定要到。');
def('nikobuchi','仁淀川 にこ淵','にこ淵',33.6172,133.2278,'shikoku','要走一段又陡又滑的石阶下去，穿抓地的鞋。晴天正午光线直射才是那个「仁淀蓝」，阴天就是普通水潭，可以直接跳过。');
def('kochijo','高知城','高知城',33.5606,133.5312,'shikoku','天守和本丸御殿都是原构，全日本只此一座。');
def('hirome','弘人市场','ひろめ市場',33.5595,133.5310,'shikoku','稻草烧鲣鱼配土佐酒，中午就开始喝。位子要自己抢，靠里的摊位人少一点。');
def('katsurahama','桂浜','桂浜',33.4972,133.5747,'shikoku','坂本龙马像背对你面朝太平洋。浪很大，不能下水。日落时来。');
def('kotohira','金刀比罗宫','金刀比羅宮',34.1850,133.8107,'shikoku','785 级石阶到本宫，还有力气再上 583 级到奥社。石阶口有免费借的拐杖，别逞强。');
def('ritsurin','栗林公园','栗林公園',34.3286,134.0431,'shikoku','米其林三星庭园，走南庭回游路线一个多小时。闭园前一小时光最好。');
def('udon','讃岐乌冬巡礼','讃岐うどん',34.2400,133.9300,'shikoku','制面所七点就开门，一碗釜揚げ三百日元。开车路过随便找一家都不会差，但很多店卖完就关，中午前去。');
def('naoshima','直岛 / 地中美术馆','直島 地中美術館',34.4585,133.9932,'shikoku','必须提前网上预约指定时段，热门时间会满。莫奈厅是白石子地面全靠天然光，阴天和晴天完全两样。岛上骑车最方便。');
def('pumpkin','草间弥生 黄南瓜','黄かぼちゃ',34.4530,133.9987,'shikoku','海堤上那只。来都来了。');
def('takamatsu','高松港','高松港',34.3510,134.0463,'shikoku','跳岛的枢纽，也是四国自驾还车的地方。骨付鳥是香川另一张牌。');
def('matsuyama','松山城 / 道后温泉','道後温泉本館',33.8521,132.7862,'shikoku','道后温泉本馆是千与千寻汤屋原型之一，本馆一直在分段修，去之前查哪部分开放。松山城天守也是现存十二座之一。');
def('shimanami','岛波海道','しまなみ海道',34.1080,133.0060,'shikoku','全程 70 公里跨六座岛。租电助力车只骑前 20 公里到来岛海峡大桥就已经很值。不骑车开车上桥也行。');

/* — 熊野 — */
def('tanabe','纪伊田边','紀伊田辺',33.7367,135.3800,'kumano','进山的巴士从站前发。站前有超市，水和行动粮在这儿做最后一次补给，山里没有便利店。');
def('takijiri','泷尻王子','滝尻王子',33.7963,135.4963,'kumano','中边路正式起点。对面熊野古道馆卖朱印帐，100 日元一本，沿途盖章，集满能换完歩证明。');
def('takahara','高原 霧の郷','高原霧の郷',33.8112,135.5093,'kumano','海拔 320 米的梯田村落，民宿含早晚两餐。运气好清晨能看到云海，但这个真的看运气。');
def('chikatsuyu','近露王子','近露王子',33.8228,135.5875,'kumano','第二晚落脚的村子，有咖啡店能坐下。民宿晚饭是山菜和香鱼，八点就该睡了，第二天巴士很早。');
def('gyuba','牛马童子口','牛馬童子口',33.8194,135.5610,'kumano','巴掌大的石像骑在牛马之间，中边路最有名的一张照片。就在路边，不留神会走过去。');
def('tsugizakura','継樱王子','継桜王子',33.8285,135.6199,'kumano','一排八百年的杉树只朝南长枝，当地叫「野中の一方杉」。旁边有个泉水可以接水。');

const WXP=[{k:'kyoto',n:'京都',lat:35.0037,lng:135.7681},{k:'hongu',n:'熊野本宫',lat:33.8404,lng:135.7737}];
let WX={fc:null,hist:null,at:0,err:null};
function tripWindow(v){
 const a=v.days[0].d.split('.'),b=v.days[v.days.length-1].d.split('.');
 return{y:2026,a:`2026-${a[0]}-${a[1]}`,b:`2026-${b[0]}-${b[1]}`,
        la:`2025-${a[0]}-${a[1]}`,lb:`2025-${b[0]}-${b[1]}`}}
async function loadWX(force){
 const c=await S.get('jp:wx');
 if(!force&&c&&Date.now()-c.at<3*3600e3&&c.opt===st.variant){WX=c;return}
 const la=WXP.map(x=>x.lat).join(','),lo=WXP.map(x=>x.lng).join(',');
 try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}`+
   `&daily=precipitation_sum,temperature_2m_max,temperature_2m_min,weather_code`+
   `&timezone=Asia%2FTokyo&forecast_days=7&models=jma_seamless`);
  if(!r.ok)throw 0;const j=await r.json();WX.fc=Array.isArray(j)?j:[j];WX.err=null}
 catch(e){WX.err='预报没拉到';if(c)WX.fc=c.fc}
 const w=tripWindow(V[st.variant]);
 try{const r2=await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${la}&longitude=${lo}`+
   `&start_date=${w.la}&end_date=${w.lb}&daily=precipitation_sum,temperature_2m_max&timezone=Asia%2FTokyo`);
  if(r2.ok){const j2=await r2.json();WX.hist={w,d:Array.isArray(j2)?j2:[j2]}}}
 catch(e){if(c&&c.hist)WX.hist=c.hist}
 WX.at=Date.now();WX.opt=st.variant;await S.set('jp:wx',WX)}
function wxBlock(s){
 if(WX.hist){
  const box=el('div','wx');
  box.appendChild(el('div','wxh',`<span class="wxn">去年同期实测</span><span class="wxm">${WX.hist.w.la} → ${WX.hist.w.lb}</span>`));
  const row=el('div','wxd');
  WXP.forEach((pt,i)=>{
   const d=WX.hist.d[i]?.daily;if(!d)return;
   const rain=(d.precipitation_sum||[]).filter(x=>x>=1).length;
   const heavy=(d.precipitation_sum||[]).filter(x=>x>=20).length;
   const hot=(d.temperature_2m_max||[]).filter(x=>x>=30).length;
   const c=el('div','wxc');
   c.innerHTML=`<div class="dd">${pt.n}</div><div class="sn">${rain}<small> / ${(d.precipitation_sum||[]).length} 天有雨</small></div>`+
    `<div class="tt">暴雨 ${heavy} 天 · 30°C 以上 ${hot} 天</div>`;
   row.appendChild(c)});
  box.appendChild(row);s.appendChild(box)}
 if(WX.fc){
  WXP.forEach((pt,i)=>{
   const d=WX.fc[i]?.daily;if(!d)return;
   const box=el('div','wx');
   box.appendChild(el('div','wxh',`<span class="wxn">${pt.n} · 未来 7 天</span><span class="wxm">JMA</span>`));
   const row=el('div','wxd');
   d.time.forEach((t,j)=>{const r=d.precipitation_sum[j]||0;const c=el('div','wxc');
    c.innerHTML=`<div class="dd">${t.slice(5).replace('-','/')}</div>`+
     `<div class="sn" style="color:${r>=10?'var(--shu)':r>0?'var(--ai)':'var(--faint)'};font-size:14px">${r>0?r.toFixed(0):'·'}</div>`+
     `<div class="tt">${Math.round(d.temperature_2m_min[j])}/${Math.round(d.temperature_2m_max[j])}°</div>`;
    row.appendChild(c)});
   box.appendChild(row);s.appendChild(box)})}
 const n=el('p','lede');n.style.cssText='font-size:11.5px;color:var(--faint);margin:2px 0 20px';
 n.innerHTML=(WX.err?`<span style="color:var(--kin)">${WX.err}（离线或被拦截，显示上次缓存）</span> · `:'')+
  '降水单位 mm。7 天预报现在没用，<strong>出发前两周开始每天看</strong>。上面那栏是去年同一时间窗的实测——想知道「9 月下旬到底会不会一直下雨」，看它比看月均值靠谱。数据 Open-Meteo（CC BY 4.0）。';

/* ══════ .ics 导出 ══════ */
function toICS(){
 const v=V[st.variant],pad=n=>String(n).padStart(2,'0');
 const nx=d=>{const t=new Date(`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}T00:00:00Z`);
  t.setUTCDate(t.getUTCDate()+1);return `${t.getUTCFullYear()}${pad(t.getUTCMonth()+1)}${pad(t.getUTCDate())}`};
 const E=t=>String(t).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 let o='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//kansai//ZH\r\nCALSCALE:GREGORIAN\r\n';
 v.days.forEach((d,i)=>{
  const ds='2026'+d.d.replace('.','');
  const body=[d.note||'',...d.stops.map(x=>`${x.t} ${x.n}${x.s?' — '+x.s:''}`)].filter(Boolean).join('\n');
  o+=`BEGIN:VEVENT\r\nUID:kansai-${st.variant}-${i}@local\r\nDTSTAMP:${ds}T000000Z\r\n`+
   `DTSTART;VALUE=DATE:${ds}\r\nDTEND;VALUE=DATE:${nx(ds)}\r\nSUMMARY:${E(d.t)}\r\n`+
   (d.stay&&d.stay!=='—'?`LOCATION:${E(d.stay)}\r\n`:'')+`DESCRIPTION:${E(body)}\r\nEND:VEVENT\r\n`});
 o+='END:VCALENDAR\r\n';
 const bl=new Blob([o],{type:'text/calendar;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=`kansai-${st.variant}.ics`;
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
 toast('已导出 '+v.days.length+' 天到日历')}

  V[st.variant].days.forEach(d=>d.stops.forEach(s=>{ if(s.p&&P[s.p]) pts.push([P[s.p].lat,P[s.p].lng]); }));

  if(pts.length) map.flyToBounds(L.latLngBounds(pts).pad(.12),{duration:.85});
  $('#allBtn').classList.add('on');
}

/* ══════════════════════════════════════════════════════════════
   8. COLLAB
   ══════════════════════════════════════════════════════════════ */
async function pull(loud){
  $('#syncDot').className='dot busy';
  const [pins,mems,bk,nt]=await Promise.all([S.get(K.pins(),true),S.get(K.mem(),true),
    S.get(K.bk(),true),S.get(K.notes(),true)]);
  if(Array.isArray(pins)) st.pins=pins;
  if(Array.isArray(mems)) st.members=mems;
  if(bk&&typeof bk==='object') st.bk=bk;
  if(nt&&typeof nt==='object') st.notes=nt;
  $('#syncDot').className = S.ok ? 'dot' : 'dot off';
  renderMembers(); renderTabs(); if(st.tab==='places') renderBody(); drawPins();
  if(loud) toast(S.ok?`已同步 · ${st.pins.length} 个点`:'当前环境无共享存储，改动只保留在本次会话');
}
async function pushPins(){ $('#syncDot').className='dot busy'; await S.set(K.pins(),st.pins,true); $('#syncDot').className=S.ok?'dot':'dot off'; }
async function joinRoom(){
  if(!st.me.id) return;
  const m=await S.get(K.mem(),true) || [];
  const i=m.findIndex(x=>x.id===st.me.id);
  const rec={id:st.me.id,name:st.me.name,color:st.me.color,at:Date.now()};
  if(i>=0) m[i]=rec; else m.push(rec);
  st.members=m; await S.set(K.mem(),m,true); renderMembers();
}
function dropPin(ll){
  if(!st.me.name){ meModal(()=>dropPin(ll)); return; }
  addModal({lat:ll.lat,lng:ll.lng});
}
async function toggleLike(id){
  if(!st.me.id) return meModal();
  const p=st.pins.find(x=>x.id===id); if(!p) return;
  p.likes=p.likes||[];
  const i=p.likes.indexOf(st.me.id);
  if(i>=0) p.likes.splice(i,1); else p.likes.push(st.me.id);
  renderBody(); drawPins(); await pushPins();
}
async function delPin(id){
  st.pins=st.pins.filter(p=>p.id!==id);
  renderTabs(); renderBody(); drawPins(); await pushPins(); toast('已删除');
}

/* ══════════════════════════════════════════════════════════════
   9. MODALS
   ══════════════════════════════════════════════════════════════ */
function openModal(html,setup){
  const b=$('#mbox'); b.innerHTML=html; $('#modal').classList.add('show'); setup&&setup(b);
  b.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal);
}
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };

function meModal(after){
  openModal(`<h3>你是谁</h3><p class="mp">名字会出现在你添加的每个点旁边，同行的人才知道是谁想去的。</p>
    <div class="field"><label class="lb">名字</label><input type="text" id="mn" maxlength="12" value="${esc(st.me.name)}" placeholder="比如 小K"></div>
    <div class="field"><label class="lb">颜色</label><div id="cw" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
    <div class="row" style="margin-top:16px"><button class="btn" data-close>取消</button><button class="btn pri" id="ms">保存</button></div>`,
  b=>{
    const cw=b.querySelector('#cw');
    AVCOL.forEach(c=>{
      const d=el('button'); d.style.cssText=`width:26px;height:26px;border-radius:50%;background:${c};border:2px solid ${st.me.color===c?'#EAE8E2':'transparent'}`;
      d.onclick=()=>{ st.me.color=c; meModal(after); };
      cw.appendChild(d);
    });
    b.querySelector('#mn').focus();
    b.querySelector('#ms').onclick=async()=>{
      const n=b.querySelector('#mn').value.trim();
      if(!n) return toast('填个名字');
      st.me.name=n; st.me.id=st.me.id||uid();
      closeModal(); saveCfg(); await joinRoom(); renderMembers(); toast('已加入 '+st.room);
      after&&after();
    };
  });
}
function roomModal(){
  openModal(`<h3>行程码</h3><p class="mp">同一个码 = 同一份地图，你和同行的人加的点会互相同步。<strong style="color:var(--text)">换一个没人用过的码，就得到一份全新的空白行程</strong>——别人也可以这样拿去建自己的。</p>
    <div class="field"><label class="lb">当前行程码</label><input type="text" id="rc" maxlength="24" value="${esc(st.room)}" placeholder="jp2610"></div>
    <p class="mp" style="font-size:11.5px;color:var(--faint)">只能用字母数字和短横线。共享数据对所有知道这个码的人可见。</p>
    <div class="row"><button class="btn" data-close>取消</button><button class="btn pri" id="rs">切换</button></div>`,
  b=>{
    b.querySelector('#rs').onclick=async()=>{
      const v=b.querySelector('#rc').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
      if(v.length<3) return toast('至少 3 个字符');
      st.room=v; closeModal(); saveCfg(); st.pins=[]; st.members=[];
      await pull(); await joinRoom(); toast('已切换到 '+v);
    };
  });
}
function addModal(pre){
  if(!st.me.name) return meModal(()=>addModal(pre));
  openModal(`<h3>添加地点</h3><p class="mp">${pre?'已从地图取到坐标。':'不知道坐标就先随便填，之后在地图上长按重新落点。'}</p>
    <div class="field"><label class="lb">名字</label><input type="text" id="an" maxlength="40" placeholder="比如 一芳亭 烧卖"></div>
    <div class="field"><label class="lb">为什么想去（可选）</label><textarea id="ad" maxlength="200" placeholder="朋友推荐 / 小红书看到的 / 想买的东西"></textarea></div>
    <div class="row">
      <div class="field"><label class="lb">纬度</label><input type="number" id="alat" step="0.0001" value="${pre?pre.lat.toFixed(5):''}"></div>
      <div class="field"><label class="lb">经度</label><input type="number" id="alng" step="0.0001" value="${pre?pre.lng.toFixed(5):''}"></div>
    </div>
    <div class="row" style="margin-top:6px"><button class="btn" data-close>取消</button><button class="btn pri" id="as">加进地图</button></div>`,
  b=>{
    b.querySelector('#an').focus();
    b.querySelector('#as').onclick=async()=>{
      const n=b.querySelector('#an').value.trim();
      const lat=parseFloat(b.querySelector('#alat').value), lng=parseFloat(b.querySelector('#alng').value);
      if(!n) return toast('给它起个名字');
      if(isNaN(lat)||isNaN(lng)) return toast('需要坐标 — 在地图上长按取一个');
      st.pins.push({id:uid(),name:n,note:b.querySelector('#ad').value.trim(),lat,lng,by:st.me.name,byId:st.me.id,color:st.me.color,likes:[],at:Date.now()});
      closeModal(); st.tab='places'; renderTabs(); renderBody(); drawPins();
      map.flyTo([lat,lng],13,{duration:.7});
      await pushPins(); toast('已添加，同行的人也能看到了');
    };
  });
}
function exportJSON(){
  const d={room:st.room,variant:st.variant,pins:st.pins,budget:st.budget,done:st.done,rate:st.rate};
  const t=JSON.stringify(d,null,2);
  openModal(`<h3>导出</h3><p class="mp">复制走，可以粘回任何一个行程码里。</p>
    <textarea id="ex" style="height:230px;font-family:var(--mono);font-size:11px">${esc(t)}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn" data-close>关闭</button><button class="btn pri" id="cp">复制</button></div>`,
  b=>{ b.querySelector('#cp').onclick=async()=>{
    const ta=b.querySelector('#ex');
    try{ await navigator.clipboard.writeText(ta.value); }
    catch(e){ ta.select(); try{ document.execCommand('copy'); }catch(_){ return toast('复制失败 — 手动全选'); } }
    toast('已复制');
  }; });
}
function importJSON(){
  openModal(`<h3>导入</h3><p class="mp">粘贴一份导出的 JSON。会覆盖当前行程码下的点位和预算。</p>
    <textarea id="im" style="height:200px;font-family:var(--mono);font-size:11px" placeholder='{"pins":[...]}'></textarea>
    <div class="row" style="margin-top:12px"><button class="btn" data-close>取消</button><button class="btn pri" id="io">导入</button></div>`,
  b=>{ b.querySelector('#io').onclick=async()=>{
    try{
      const d=JSON.parse(b.querySelector('#im').value);
      if(Array.isArray(d.pins)) st.pins=d.pins;
      if(d.budget) st.budget=d.budget;
      if(d.done) st.done=d.done;
      if(d.variant&&V[d.variant]) st.variant=d.variant;
      if(d.rate) st.rate=d.rate;
      closeModal(); renderSeals(); renderTabs(); renderBody(); drawPlaces(); drawPins();
      await pushPins(); saveCfg(); toast('导入完成');
    }catch(e){ toast('JSON 格式不对'); }
  };});
}

/* ══════════════════════════════════════════════════════════════
   10. LOCAL CONFIG
   ══════════════════════════════════════════════════════════════ */
let saveT;
function saveCfg(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>S.set(K.cfg(),{room:st.room,variant:st.variant,me:st.me,budget:st.budget,done:st.done,rate:st.rate,perPerson:st.perPerson,ccy:st.ccy}),350);
}
async function loadCfg(){
  const c=await S.get(K.cfg());
  if(c){
    st.room=c.room||st.room; st.variant=V[c.variant]?c.variant:'A';
    st.me=c.me||st.me; st.budget=c.budget||{}; st.done=c.done||{};
    st.rate=c.rate||115; st.perPerson=!!c.perPerson; st.ccy=c.ccy||'CAD';
  }
}

/* ══════════════════════════════════════════════════════════════
   11. MOBILE BOTTOM SHEET
   ══════════════════════════════════════════════════════════════ */
const SNAP=[0.14,0.55,0.90];
let snapI=1, sheetPx=0;
const VH=()=>window.innerHeight;
function snapTo(i){
  if(window.innerWidth>900) return;
  snapI=Math.max(0,Math.min(SNAP.length-1,i));
  sheetPx=SNAP[snapI]*VH();
  document.documentElement.style.setProperty('--sheet-h',sheetPx+'px');
}
(function sheet(){
  const p=$('#panel'), g=$('#grab'), sc=$('#scroll');
  let y0=0,h0=0,drag=false,moved=false;
  const start=e=>{
    if(window.innerWidth>900) return;
    drag=true; moved=false; p.classList.add('dragging');
    y0=(e.touches?e.touches[0].clientY:e.clientY);
    h0=sheetPx||SNAP[snapI]*VH();
  };
  const move=e=>{
    if(!drag) return;
    const y=(e.touches?e.touches[0].clientY:e.clientY);
    if(Math.abs(y-y0)>3){ moved=true; if(e.cancelable) e.preventDefault(); }
    sheetPx=Math.max(70,Math.min(VH()*0.92,h0-(y-y0)));
    document.documentElement.style.setProperty('--sheet-h',sheetPx+'px');
  };
  const end=()=>{
    if(!drag) return; drag=false; p.classList.remove('dragging');
    if(!moved){ snapTo(snapI===2?1:2); return; }
    const frac=sheetPx/VH();
    let best=0,bd=Infinity;
    SNAP.forEach((s,i)=>{ const d=Math.abs(s-frac); if(d<bd){bd=d;best=i;} });
    snapTo(best);
  };
  g.addEventListener('touchstart',start,{passive:true});
  g.addEventListener('touchmove',move,{passive:false});
  g.addEventListener('touchend',end);
  g.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  // 内容已滚到顶还继续下拉 → 降一档
  let sy=0;
  sc.addEventListener('touchstart',e=>{ sy=e.touches[0].clientY; },{passive:true});
  sc.addEventListener('touchmove',e=>{
    if(window.innerWidth>900) return;
    if(sc.scrollTop<=0 && e.touches[0].clientY-sy>64 && snapI>0){ snapTo(snapI-1); sy=e.touches[0].clientY; }
  },{passive:true});
})();

/* ══════════════════════════════════════════════════════════════
   12. BOOT
   ══════════════════════════════════════════════════════════════ */
$('#baseBtn').onclick=()=>setBase((baseIdx+1)%BASES.length);
$('#allBtn').onclick=showAll;
$('#addBtn').onclick=()=>setAdding(!adding);
$('#roomBtn').onclick=roomModal;
$('#meBtn').onclick=()=>meModal();
window.addEventListener('resize',()=>{ if(window.innerWidth>900) document.documentElement.style.removeProperty('--sheet-h'); else snapTo(snapI); setTimeout(()=>map&&map.invalidateSize(),120); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') { closeModal(); if(adding) setAdding(false); } });

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});}
(async function boot(){
  await loadCfg();
  initMap();
  renderSeals(); renderTabs(); renderBody(); renderMembers();
  drawPlaces(); showAll();
  await pull();
  loadWX().then(()=>{ if(st.tab==='plan') renderBody(); });
  if(st.me.id) joinRoom();
  snapTo(1);
  setInterval(()=>{ if(document.visibilityState==='visible') pull(); }, 9000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pull(); });
  if(!S.ok) $('#syncDot').className='dot off';
  setTimeout(()=>map.invalidateSize(),200);
})();
</script>
